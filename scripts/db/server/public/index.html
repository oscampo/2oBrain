<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>2oB</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="/vendor/d3.v7.min.js"></script>
<style>
  /* Temas: ver sección "Configuración". data-theme en <html> gana siempre;
     sin él, "prefers-color-scheme"/"prefers-contrast" del sistema deciden
     (tema por defecto = "seguir el sistema"). --accent-text y --console-bg
     evitan los 2 colores que antes quedaban fijos fuera del sistema de
     variables (botón principal, caja de salida). */
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8eb;
    --muted: #8a8f99; --accent: #6ea8fe; --accent-text: #0f1115; --console-bg: #0a0c10;
    --ok: #4caf6d; --warn: #d8a531; --err: #e05561;
    --ui-scale: 1;
  }
  html[data-theme="light"] {
    --bg: #f7f8fa; --panel: #ffffff; --border: #d8dce2; --text: #1a1d23;
    --muted: #5b6270; --accent: #2f6fed; --accent-text: #ffffff; --console-bg: #eef0f3;
    --ok: #1e8e4f; --warn: #a86a00; --err: #c62839;
  }
  html[data-theme="hc-dark"] {
    --bg: #000000; --panel: #0a0a0a; --border: #ffffff; --text: #ffffff;
    --muted: #d8d8d8; --accent: #66d9ff; --accent-text: #000000; --console-bg: #000000;
    --ok: #00e676; --warn: #ffd600; --err: #ff6e6e;
  }
  html[data-theme="hc-light"] {
    --bg: #ffffff; --panel: #ffffff; --border: #000000; --text: #000000;
    --muted: #2b2b2b; --accent: #0000ee; --accent-text: #ffffff; --console-bg: #f0f0f0;
    --ok: #006400; --warn: #7a5c00; --err: #a00000;
  }
  @media (prefers-color-scheme: light) {
    html:not([data-theme]) {
      --bg: #f7f8fa; --panel: #ffffff; --border: #d8dce2; --text: #1a1d23;
      --muted: #5b6270; --accent: #2f6fed; --accent-text: #ffffff; --console-bg: #eef0f3;
      --ok: #1e8e4f; --warn: #a86a00; --err: #c62839;
    }
  }
  @media (prefers-contrast: more) and (prefers-color-scheme: light) {
    html:not([data-theme]) { --border: #000000; --muted: #202020; }
  }
  @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
    html:not([data-theme]) { --border: #ffffff; --muted: #d8d8d8; }
  }
  html[data-density="compact"] { --ui-scale: 0.85; }
  html[data-density="large"] { --ui-scale: 1.25; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, sans-serif; font-size: calc(14px * var(--ui-scale)); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  header .badge { font-size: calc(11px * var(--ui-scale)); color: var(--warn); border: 1px solid var(--warn); padding: 2px 8px; border-radius: 999px; }
  .layout { display: flex; min-height: calc(100vh - 49px); }
  .sidebar { width: calc(190px * var(--ui-scale)); border-right: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; }
  .brand { display: flex; flex-direction: column; align-items: center; padding: calc(20px * var(--ui-scale)) 10px calc(14px * var(--ui-scale)); border-bottom: 1px solid var(--border); text-align: center; }
  .brand-logo { width: 50%; height: auto; }
  .brand-name { margin-top: calc(8px * var(--ui-scale)); font-size: calc(16px * var(--ui-scale)); font-weight: 700; color: var(--text); }
  .brand-sub { font-size: calc(11.5px * var(--ui-scale)); color: var(--muted); }
  nav { padding: 12px 0; }
  nav button { display: block; width: 100%; text-align: left; padding: calc(9px * var(--ui-scale)) 18px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: calc(13px * var(--ui-scale)); }
  nav button:hover { color: var(--text); background: var(--panel); }
  nav button.active { color: var(--accent); background: var(--panel); border-left: 2px solid var(--accent); padding-left: 16px; }
  .nav-group {
    margin: calc(16px * var(--ui-scale)) 10px calc(6px * var(--ui-scale));
    padding: calc(5px * var(--ui-scale)) 12px;
    font-size: calc(10.5px * var(--ui-scale)); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 5px;
  }
  .nav-group:first-child { margin-top: calc(6px * var(--ui-scale)); }
  main { flex: 1; padding: 22px 26px; max-width: 900px; }
  section { display: none; }
  section.active { display: block; }
  h2 { font-size: calc(16px * var(--ui-scale)); margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: calc(12px * var(--ui-scale)); margin: 0 0 16px; }
  ul.scenarios { margin: 0; padding-left: 20px; font-size: calc(13px * var(--ui-scale)); line-height: 1.6; }
  ul.scenarios li { margin-bottom: 12px; }
  ul.scenarios code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: calc(12px * var(--ui-scale)); }
  ul.scenarios em { color: var(--muted); font-style: normal; }
  label { display: block; font-size: calc(12px * var(--ui-scale)); color: var(--muted); margin: 10px 0 4px; }
  /* Convención (2026-09-06, acordada con el usuario): todo campo editable
     por el usuario lleva un tinte del color de acento al 18% de fondo, para
     que se distinga a simple vista de texto de solo lectura (ej. el nombre
     de categoría sugerido en "Candidatos de categoría" no se notaba como
     editable). Mismo porcentaje que ya usaban los nodos del grafo
     (.gph-circle/.gph-dot) -- se generaliza aquí como el lenguaje visual
     único para "esto lo puedes cambiar". input[type=color] queda fuera: es
     un selector visual, no un campo de texto. */
  input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
    width: 100%; background: color-mix(in srgb, var(--accent) 18%, var(--panel)); border: 1px solid var(--border); color: var(--text);
    padding: calc(7px * var(--ui-scale)) 9px; border-radius: 6px; font-size: calc(13px * var(--ui-scale)); font-family: inherit;
  }
  input[type=color] {
    width: 100%; border: 1px solid var(--border);
    padding: 4px; height: calc(34px * var(--ui-scale)); border-radius: 6px; cursor: pointer;
  }
  textarea { font-family: ui-monospace, monospace; min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .checkline { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .confirm-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; max-width: 520px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .confirm-message { white-space: pre-wrap; font-family: inherit; color: var(--text); font-size: calc(13px * var(--ui-scale)); margin: 0 0 16px; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .checkline label { margin: 0; }
  button.run {
    margin-top: 16px; background: var(--accent); color: var(--accent-text); border: none; padding: calc(8px * var(--ui-scale)) 18px;
    border-radius: 6px; font-size: calc(13px * var(--ui-scale)); font-weight: 600; cursor: pointer;
  }
  button.run:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: none; border: 1px solid var(--border); color: var(--text); margin-left: 8px; }
  .out {
    margin-top: 16px; background: var(--console-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; font-size: calc(12.5px * var(--ui-scale)); max-height: 60vh; overflow-y: auto;
  }
  pre.out { white-space: pre-wrap; word-break: break-word; }
  .out.err { border-color: var(--err); }
  .out.ok { border-color: var(--ok); }
  .out-md { font-size: 13.5px; line-height: 1.6; }
  .out-md h2, .out-md h3, .out-md h4, .out-md h5, .out-md h6 { margin: 16px 0 6px; color: var(--text); }
  .out-md :first-child { margin-top: 0; }
  .out-md p { margin: 0 0 10px; }
  .out-md ul, .out-md ol { margin: 0 0 10px; padding-left: 22px; }
  .out-md li { margin-bottom: 4px; }
  .out-md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .out-md strong { color: var(--text); font-weight: 600; }
  .out-md code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: ui-monospace, monospace; }
  .out-md-table-wrap { overflow-x: auto; margin: 0 0 10px; }
  .out-md table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .out-md th, .out-md td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .out-md th { background: var(--panel); color: var(--text); white-space: nowrap; }
  .status { font-size: 12px; margin-top: 10px; color: var(--muted); }
  /* Timeline visual (reconstruido 2026-09-07 tras un intento con otro LLM que
     dejó el archivo con encoding corrupto y JSX inválido dentro del script
     principal, sin build step que lo transpile): línea vertical con un punto
     por registro, coloreado por kind, agrupado por mes, más una franja de
     densidad (registros por mes) arriba, en el mismo lenguaje visual que
     .gph-stats/.fact-card ya usan en el resto del dashboard. */
  .tl-density { display: flex; gap: 3px; align-items: flex-end; height: 36px; margin-top: 14px; }
  .tl-density-bar { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .55; }
  .tl-density-bar:hover { opacity: .9; }
  .tl-line { margin-top: 18px; }
  /* Meses colapsables (<details> nativo, sin JS de toggle propio) + paginación
     por bloques dentro de cada mes -- ver comentario junto a la sección
     Timeline en el <script> para el porqué (2026-09-07). */
  .tl-month-group, .tl-year-group { border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; background: var(--panel); overflow: hidden; }
  .tl-month-group summary, .tl-year-group summary { cursor: pointer; padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--text); list-style: none; display: flex; align-items: center; gap: 8px; text-transform: capitalize; }
  .tl-year-group summary { font-size: 13.5px; }
  .tl-month-group summary::-webkit-details-marker, .tl-year-group summary::-webkit-details-marker { display: none; }
  .tl-month-group summary::before, .tl-year-group summary::before { content: '▶'; font-size: 9px; color: var(--muted); transition: transform .15s; flex-shrink: 0; }
  .tl-month-group[open] summary::before, .tl-year-group[open] summary::before { transform: rotate(90deg); }
  .tl-month-count { color: var(--muted); font-weight: 400; text-transform: none; }
  .tl-year-content { padding: 2px 12px 10px; border-top: 1px solid var(--border); }
  .tl-month-content { padding: 2px 12px 10px 26px; position: relative; border-top: 1px solid var(--border); }
  .tl-month-content::before { content: ''; position: absolute; left: 11px; top: 0; bottom: 10px; width: 2px; background: var(--border); }
  .tl-entry { position: relative; padding: 12px 0 0 14px; }
  .tl-entry::before { content: ''; position: absolute; left: -20px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); }
  .tl-entry.tl-kind-event::before { background: var(--warn); }
  .tl-entry.tl-kind-commitment::before { background: var(--ok); }
  .tl-entry.tl-reemplazado::before { background: var(--muted); }
  .tl-entry-date { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tl-entry-claim { font-size: 13.5px; margin-top: 2px; }
  .tl-entry.tl-reemplazado .tl-entry-claim { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }
  .tl-entry-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  /* Hilos de versión: la cabeza (vigente) de una cadena de reemplazos trae
     este toggle, que despliega las versiones anteriores debajo en vez de
     mostrarlas como entradas planas sueltas en otros meses. */
  .tl-history-toggle { font-size: 11px; color: var(--accent); text-decoration: underline dotted; cursor: pointer; margin-top: 6px; display: inline-block; }
  .tl-history { margin-top: 8px; padding-left: 14px; border-left: 2px dashed var(--border); display: none; }
  .tl-history.open { display: block; }
  .tl-history-item { padding: 6px 0; }
  .tl-history-item + .tl-history-item { border-top: 1px dashed var(--border); }
  .tl-history-item .tl-entry-claim { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); font-size: 12.5px; }
  .tl-load-more { display: block; margin: 10px 0 2px; padding: 6px 14px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .tl-load-more:hover { background: var(--panel); border-color: var(--accent); }
  .tl-load-more-months { width: 100%; text-align: center; margin-top: 12px; }
  /* Selector Lista/Gráfico/Heatmap + resaltado de filtro + vista de día
     plano (clic en el heatmap) + calendario tipo GitHub + puntos del
     gráfico d3 -- ver comentario junto a la sección Timeline en el
     <script> (segunda ronda, 2026-09-07). */
  .tl-view-toggle { display: flex; gap: 6px; margin-top: 14px; }
  .tl-view-btn { padding: 5px 14px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .tl-view-btn.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .tl-hl { background: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--text); border-radius: 2px; padding: 0 1px; }
  .tl-month-header-plain { font-size: 12.5px; font-weight: 600; color: var(--text); margin: 14px 0 10px; text-transform: capitalize; }
  .tl-heatmap-scroll { overflow-x: auto; padding-bottom: 4px; margin-top: 18px; }
  .tl-heatmap-months { display: flex; gap: 3px; margin-bottom: 4px; }
  .tl-heatmap-month-label { width: 12px; font-size: 10px; color: var(--muted); flex-shrink: 0; text-transform: capitalize; overflow: visible; white-space: nowrap; }
  .tl-heatmap-grid { display: flex; gap: 3px; }
  .tl-heatmap-col { display: flex; flex-direction: column; gap: 3px; }
  .tl-heatmap-cell { width: 12px; height: 12px; border-radius: 2px; background: var(--border); cursor: default; }
  .tl-heatmap-empty { visibility: hidden; }
  .tl-heatmap-b1 { background: color-mix(in srgb, var(--accent) 25%, var(--border)); }
  .tl-heatmap-b2 { background: color-mix(in srgb, var(--accent) 50%, var(--border)); }
  .tl-heatmap-b3 { background: color-mix(in srgb, var(--accent) 75%, var(--border)); }
  .tl-heatmap-b4 { background: var(--accent); cursor: pointer; }
  .tl-heatmap-b1, .tl-heatmap-b2, .tl-heatmap-b3 { cursor: pointer; }
  .tl-heatmap-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .tl-chart-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 1; }
  .tl-chart-dot.tl-kind-event { fill: var(--warn); }
  .tl-chart-dot.tl-kind-commitment { fill: var(--ok); }
  .tl-chart-tooltip { position: absolute; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 12px; color: var(--text); white-space: pre-wrap; max-width: 420px; line-height: 1.4; pointer-events: none; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .tl-chart-tooltip b { font-size: 11px; color: var(--muted); font-weight: 600; }
  .fact-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-top: 14px; }
  .fact-card.excluded { opacity: 0.5; }
  .fact-card .fc-top { display: flex; align-items: flex-start; gap: 10px; }
  .fact-card .fc-top label { margin: 0; color: var(--text); font-size: 13px; }
  .fact-card textarea { min-height: 60px; }
  .fact-card .fc-fragment { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 8px; }
  .fact-card .fc-suggestions { color: var(--accent); font-size: 12px; margin-top: 6px; cursor: default; }
  .fact-card .fc-suggestions span { cursor: pointer; text-decoration: underline dotted; }
  .gph-stats { display: flex; flex-wrap: wrap; gap: 10px; }
  .gph-stat { display: flex; align-items: baseline; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; }
  .gph-stat b { font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .gph-stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .gph-circle { fill: color-mix(in srgb, var(--graph-normal, var(--accent)) 60%, transparent); stroke: var(--graph-normal, var(--accent)); stroke-width: 2; }
  .gph-circle.gph-meta { fill: color-mix(in srgb, var(--graph-meta, var(--warn)) 60%, transparent); stroke: var(--graph-meta, var(--warn)); stroke-width: 2; stroke-dasharray: 4 3; }
  .gph-circle.gph-circle-highlight { fill: color-mix(in srgb, var(--graph-highlight, var(--err)) 30%, transparent); stroke: var(--graph-highlight, var(--err)); stroke-width: 2.5; }
  .gph-count { font-size: 12px; font-weight: 600; fill: var(--graph-normal, black); text-anchor: middle; }
  .gph-node.gph-meta .gph-count { fill: var(--graph-meta, var(--warn)); }
  /* Alto contraste (hallazgo del usuario): el relleno semitransparente de abajo
     deja ver la línea/flecha de la conexión por debajo, dificultando leer el
     número, no es problema de orden de capas (los links ya se dibujan antes
     que los recuerdos), es que la transparencia deja pasar lo de atrás. En
     oscuro/claro se deja igual (el borde es sutil ahí, el usuario confirmó que no
     molesta); en alto contraste, relleno sólido + número en --accent-text
     (mismo color ya pensado para leerse encima de un color saturado sólido,
     válido para accent/warn/err porque en ambos temas hc- los tres son o
     todos claros (hc-dark) o todos oscuros (hc-light)). */
  html[data-theme="hc-dark"] .gph-circle, html[data-theme="hc-light"] .gph-circle { fill: var(--graph-normal, var(--accent)); }
  html[data-theme="hc-dark"] .gph-circle.gph-meta, html[data-theme="hc-light"] .gph-circle.gph-meta { fill: var(--graph-meta, var(--warn)); }
  html[data-theme="hc-dark"] .gph-circle.gph-circle-highlight, html[data-theme="hc-light"] .gph-circle.gph-circle-highlight { fill: var(--graph-highlight, var(--err)); }
  html[data-theme="hc-dark"] .gph-count, html[data-theme="hc-light"] .gph-count,
  html[data-theme="hc-dark"] .gph-node.gph-meta .gph-count, html[data-theme="hc-light"] .gph-node.gph-meta .gph-count {
    fill: var(--accent-text);
  }
  .gph-label { font-size: 10.5px; fill: var(--muted); }
  .gph-tooltip { position: absolute; transform: translate(-50%, -100%); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; pointer-events: none; z-index: 10; }
  .gph-ctx-menu { display: none; position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .gph-ctx-menu button { display: block; width: 100%; text-align: left; padding: 7px 14px; background: none; border: none; color: var(--text); font-size: 13px; cursor: pointer; border-radius: 5px; white-space: nowrap; }
  .gph-ctx-menu button:hover { background: var(--border); }
  .gph-edge { stroke: var(--border); stroke-width: 1.6; }
  .gph-edge-label { font-size: 10px; fill: var(--muted); }
  .gph-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 11px; color: var(--muted); }
  .gph-legend-item { display: flex; align-items: center; gap: 6px; }
  .gph-dot { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--graph-normal, var(--accent)) 60%, transparent); border: 2px solid var(--graph-normal, var(--accent)); }
  .gph-dot.gph-meta { background: color-mix(in srgb, var(--graph-meta, var(--warn)) 60%, transparent); border: 2px dashed var(--graph-meta, var(--warn)); }
</style>
</head>
<body>
<header>
  <span class="badge">solo local: 127.0.0.1</span>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="brand">

<script>
// Agrupado por lo que cada sección hace, no por cuándo se construyó
// (discutido y acordado con el usuario, 2026-09-03). "group" cambia entre
// entradas consecutivas dispara un encabezado nuevo en el nav.
// "advanced" (2026-09-05, acordado con el usuario): secciones de
// mantenimiento/estructura que un usuario nuevo de 2oBrain no necesita a
// diario (fusionar, alias, relaciones, categorías, modelos, recategorizar,
// y los dos borrados reales), ocultas del nav por defecto. A diferencia de
// un toggle único "todo o nada" (primer intento, corregido tras feedback
// del usuario: quería control por función, no un interruptor general), cada
// una se activa por separado desde la sección "Opciones avanzadas" (abajo),
// con su propia entrada en localStorage -- así alguien puede querer solo
// "Borrar registro" sin destapar Fusionar/Alias/Relaciones a la vez. Es
// solo un filtro visual del nav -- las rutas /api/* siguen respondiendo
// igual estén o no visibles aquí, esto reduce ruido, no restringe acceso
// (el dashboard ya es solo-localhost). Grafo y Doctor se quedan siempre
// visibles a propósito: son de solo lectura y le muestran a alguien nuevo
// que el sistema tiene coherencia interna, no un riesgo de mantenimiento.
const SECTIONS = [
  { id: 'search', label: 'Buscar', group: 'Consultar' },
  { id: 'timeline', label: 'Timeline', group: 'Consultar' },
  { id: 'memory-status', label: 'Estado de recuerdo', group: 'Consultar' },
  { id: 'graph', label: 'Grafo', group: 'Consultar' },
  { id: 'delta', label: 'Delta', group: 'Consultar' },

  { id: 'remember', label: 'Guardar registro', group: 'registros' },
  { id: 'remember-batch', label: 'Guardar lote', group: 'registros' },
  { id: 'forget', label: 'Retractar', group: 'registros' },
  { id: 'recategorize', label: 'Recategorizar registro', group: 'registros', advanced: true },
  { id: 'set-kind', label: 'Cambiar tipo de registro', group: 'registros', advanced: true },
  { id: 'edit-record', label: 'Editar registro', group: 'registros', advanced: true },
  { id: 'purge-record', label: 'Borrar registro', group: 'registros', advanced: true },

  { id: 'merge-memories', label: 'Fusionar recuerdos', group: 'Recuerdos', advanced: true },
  { id: 'aliases', label: 'Alias', group: 'Recuerdos', advanced: true },
  { id: 'relations', label: 'Relaciones', group: 'Recuerdos', advanced: true },
  { id: 'category-candidates', label: 'Candidatos de categoría', group: 'Recuerdos', advanced: true },
  { id: 'create-memory', label: 'Crear categoría/subcategoría', group: 'Recuerdos', advanced: true },
  { id: 'purge-memory', label: 'Borrar recuerdo', group: 'Recuerdos', advanced: true },

  { id: 'extract-records', label: 'Extraer de sesión', group: 'Extraer' },
  { id: 'extract-page-records', label: 'Extraer de página', group: 'Extraer' },

  { id: 'doctor', label: 'Doctor', group: 'Sistema' },
  { id: 'models', label: 'Modelos', group: 'Sistema', advanced: true },
  { id: 'task-models', label: 'Modelos por tarea', group: 'Sistema', advanced: true },
  { id: 'settings', label: 'Configuración', group: 'Sistema' },
  { id: 'advanced-options', label: 'Opciones avanzadas', group: 'Sistema' },
];

const nav = document.getElementById('nav');
const main = document.getElementById('main');

function isFeatureEnabled(id) {
  return localStorage.getItem('advFeature:' + id) === '1';
}

function setFeatureEnabled(id, enabled) {
  localStorage.setItem('advFeature:' + id, enabled ? '1' : '0');
}

function renderNav() {
  const previouslyActive = nav.querySelector('button.active')?.dataset.target;
  nav.innerHTML = '';
  let lastGroup = null;
  for (const s of SECTIONS) {
    if (s.advanced && !isFeatureEnabled(s.id)) continue;
    if (s.group !== lastGroup) {
      const h = document.createElement('div');
      h.className = 'nav-group';
      h.textContent = s.group;
      nav.appendChild(h);
      lastGroup = s.group;
    }
    const btn = document.createElement('button');
    btn.textContent = s.label;
    btn.dataset.target = s.id;
    btn.addEventListener('click', () => show(s.id));
    nav.appendChild(btn);
  }
  // Si la sección visible antes de desactivar una función era esa misma
  // función avanzada, no dejarla "activa" sin botón que la respalde --
  // vuelve a la primera sección visible (Buscar).
  const stillVisible = previouslyActive && nav.querySelector(`button[data-target="${previouslyActive}"]`);
  show(stillVisible ? previouslyActive : SECTIONS[0].id);
}

function show(id) {
  for (const btn of nav.querySelectorAll('button')) btn.classList.toggle('active', btn.dataset.target === id);
  for (const sec of main.querySelectorAll('section')) sec.classList.toggle('active', sec.id === id);
}

// Pensado para el usuario novato de 2oBrain que no sabe qué es un proceso
// ni un exit code (hallazgo real, 2026-09-04: el dashboard mostraba
// "search.mjs falló" sin ninguna pista, tras un proceso que quedó con un
// execPath obsoleto -- ver registro #578). No basta con mostrarlo siempre que
// algo falla -- Oscar lo marcó bien: eso es descuido, no diseño. La
// mayoría de los ok:false de este archivo ya traen su propia explicación
// clara (validación de formulario, un script que bloqueó algo a propósito
// con su propio mensaje) -- ahí el aviso de reinicio es ruido, no ayuda.
// Solo aplica cuando NO hay ninguna explicación real que mostrar: (1)
// result.error viene de call() cuando fetch() ni siquiera pudo conectar
// (servidor genuinamente caído -- la señal más fuerte posible de que hace
// falta reiniciar), o (2) un ok:false sin ningún mensaje en stdout/stderr/
// texto resuelto (un script que crasheó antes de poder explicarse, como
// el bug real de hoy).
const RESTART_HINT = 'Si esto no tiene sentido o nada en el dashboard responde, el servidor puede necesitar reiniciarse, cierra esta ventana y solicita a tu LLM "reinicia el servidor del dashboard" o corre node scripts/db/server/dashboard-server.mjs en una terminal dentro de tu carpeta 2oBrain';

function needsRestartHint(result, resolvedText) {
  if (result.error) return true;
  if (result.ok) return false;
  return !result.stdout && !result.stderr && !resolvedText;
}

// Reemplaza window.confirm() en todo el dashboard (2026-09-06, bug real
// reportado por el usuario): el navegador embebido de Claude Desktop no
// muestra el diálogo nativo -- confirm() vuelve false silenciosamente sin
// que aparezca nada en pantalla, así que cualquier acción irreversible
// (Retractar, Borrar registro, Borrar recuerdo, Cambiar tipo) parecía
// "cancelada por el usuario" sin que el usuario hiciera nada. Modal propio
// en DOM/CSS puro, funciona igual en cualquier navegador.
function confirmAction(message) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    const box = document.createElement('div');
    box.className = 'confirm-box';
    const text = document.createElement('pre');
    text.className = 'confirm-message';
    text.textContent = message;
    const actions = document.createElement('div');
    actions.className = 'confirm-actions';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'run secondary';
    cancelBtn.textContent = 'Cancelar';
    const okBtn = document.createElement('button');
    okBtn.className = 'run';
    okBtn.textContent = 'Confirmar';
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(text);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close(result) {
      overlay.remove();
      resolve(result);
    }
    cancelBtn.addEventListener('click', () => close(false));
    okBtn.addEventListener('click', () => close(true));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
    okBtn.focus();
  });
}

function out(container, result) {
  let pre = container.querySelector('pre.out');
  if (!pre) {
    pre = document.createElement('pre');
    pre.className = 'out';
    container.appendChild(pre);
  }
  pre.className = 'out ' + (result.ok ? 'ok' : 'err');
  pre.textContent = (result.stdout || '') + (result.stderr ? '\n[stderr]\n' + result.stderr : '') || (result.error || JSON.stringify(result, null, 2));
  if (needsRestartHint(result)) pre.textContent += '\n\n' + RESTART_HINT;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Renderer de Markdown minimalista, a propósito (sin librería externa, sin
// build step): cubre solo lo que las respuestas sintetizadas por LLM
// (memory-status.mjs, synthesize.mjs) realmente producen: encabezados #/##/###,
// **negrita**, *cursiva*, listas "- " y "1. ", "---" como separador, tablas
// GFM ("| col | col |"), párrafos. No es un parser de Markdown general: no
// hace falta serlo para este uso.
function renderMarkdown(md) {
  const lines = escapeHtml(md).split(/\r?\n/);
  let html = '';
  let listType = null; // 'ul' | 'ol' | null
  let para = [];

  function splitTableRow(line) {
    // quita la barra inicial/final opcional antes de separar celdas.
    return line.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  }
  function isTableSeparator(line) {
    return /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(line);
  }

  function inline(s) {
    // Los code spans (`...`) se extraen primero para que su contenido
    // (guiones bajos, asteriscos de identificadores de código) no se
    // confunda con énfasis: se restauran al final como <code>.
    const codeSpans = [];
    s = s.replace(/`([^`]+?)`/g, (_, code) => {
      codeSpans.push(code);
      return `@@CS${codeSpans.length - 1}@@`;
    });
    s = s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__(.+?)__/g, '<strong>$1</strong>')
      .replace(/(?<!\*)\*(?!\*)([^*]+?)\*(?!\*)/g, '<em>$1</em>')
      .replace(/(?<!_)_(?!_)([^_]+?)_(?!_)/g, '<em>$1</em>');
    return s.replace(/@@CS(\d+)@@/g, (_, i) => `<code>${codeSpans[Number(i)]}</code>`);
  }
  function flushPara() {
    if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; }
  }
  function closeList() {
    if (listType) { html += `</${listType}>`; listType = null; }
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    const ulItem = line.match(/^[-*]\s+(.*)$/);
    const olItem = line.match(/^\d+\.\s+(.*)$/);

    if (!line) { flushPara(); closeList(); continue; }
    // Tabla GFM: una fila con "|" seguida de una fila separadora
    // ("|---|---|") confirma que es una tabla y no una lista/párrafo con
    // barras sueltas: sin esa segunda línea, no se trata como tabla.
    if (line.includes('|') && isTableSeparator((lines[i + 1] || '').trim())) {
      flushPara(); closeList();
      const header = splitTableRow(line);
      i += 2; // salta la fila de encabezado y la separadora
      const rows = [];
      while (i < lines.length && lines[i].trim().includes('|')) {
        rows.push(splitTableRow(lines[i].trim()));
        i++;
      }
      i--; // el for++ vuelve a avanzar uno
      html += '<div class="out-md-table-wrap"><table><thead><tr>';
      for (const cell of header) html += `<th>${inline(cell)}</th>`;
      html += '</tr></thead><tbody>';
      for (const row of rows) {
        html += '<tr>';
        for (const cell of row) html += `<td>${inline(cell)}</td>`;
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      continue;
    }
    if (/^-{3,}$/.test(line)) { flushPara(); closeList(); html += '<hr>'; continue; }
    if (heading) {
      flushPara(); closeList();
      const level = Math.min(heading[1].length + 2, 6); // ### -> h5, deja h1/h2 para el layout general
      html += `<h${level}>${inline(heading[2])}</h${level}>`;
      continue;
    }
    if (ulItem) {
      flushPara();
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += `<li>${inline(ulItem[1])}</li>`;
      continue;
    }
    if (olItem) {
      flushPara();
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += `<li>${inline(olItem[1])}</li>`;
      continue;
    }
    closeList();
    para.push(line);
  }
  flushPara();
  closeList();
  return html;
}

// Variante de out() para respuestas de síntesis (prosa de un LLM, no salida
// tabular/plana de un script): renderiza el markdown en vez de mostrarlo
// crudo. stderr (progreso/errores del synthesize) se mantiene como texto
// plano aparte, nunca como prosa.
function outMarkdown(container, result, text) {
  let box = container.querySelector('.out-md');
  if (!box) {
    box = document.createElement('div');
    box.className = 'out out-md';
    container.appendChild(box);
  }
  const resolvedText = text ?? (result.stdout || result.answer || '');
  box.className = 'out out-md ' + (result.ok ? 'ok' : 'err');
  box.innerHTML = renderMarkdown(resolvedText || result.error || '');
  container.querySelector('.out-md-stderr')?.remove();
  const showHint = needsRestartHint(result, resolvedText);
  if (result.stderr || showHint) {
    const pre = document.createElement('pre');
    pre.className = 'out out-md-stderr';
    pre.style.marginTop = '10px';
    pre.textContent = (result.stderr ? '[stderr]\n' + result.stderr + '\n\n' : '') + (showHint ? RESTART_HINT : '');
    box.after(pre);
  }
}

// Misma fuente de verdad que remember.mjs/remember-batch.mjs (--confirm-date,
// registros #528/#530): America/Bogota, no la zona horaria del navegador.
function todayBogota() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Bogota' }).format(new Date());
}

// --- Configuración (tema, color de acento, colores del grafo, densidad,
// reducir movimiento): persistida en localStorage, por navegador, no
// sincronizada entre máquinas. Sección "Configuración" al final del nav.
const SETTINGS_KEY = 'segundo-cerebro-dashboard-settings-v1';
const DEFAULT_SETTINGS = {
  theme: 'system', // 'system' | 'dark' | 'light' | 'hc-dark' | 'hc-light'
  accent: '', // '' = usa el default del tema; ignorado en hc-dark/hc-light (protege el contraste garantizado)
  graphNormal: '', graphMeta: '', graphHighlight: '', // '' = heredan de --accent/--warn/--err
  density: 'comfortable', // 'compact' | 'comfortable' | 'large'
  reduceMotion: 'system', // 'system' | 'on' | 'off'
  searchSynthProvider: 'ollama', // proveedor por defecto para la respuesta sintetizada de "Buscar"
  searchSynthModel: '', // '' = auto (probar en orden)
};

function loadSettings() {
  try {
    const stored = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    return { ...DEFAULT_SETTINGS, ...stored };
  } catch {
    return { ...DEFAULT_SETTINGS };
  }
}

let settings = loadSettings();

function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
}

function isHighContrastTheme() {
  return settings.theme === 'hc-dark' || settings.theme === 'hc-light';
}

function prefersReducedMotion() {
  if (settings.reduceMotion === 'on') return true;
  if (settings.reduceMotion === 'off') return false;
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; }
}

function applySettings() {
  const html = document.documentElement;

  if (settings.theme === 'system') html.removeAttribute('data-theme');
  else html.dataset.theme = settings.theme;

  html.dataset.density = settings.density;

  // Override de color de acento: bloqueado en alto contraste a propósito,
  // esos temas existen para garantizar un contraste mínimo, y un acento
  // elegido a mano podría romper esa garantía sin que quien lo elige se dé
  // cuenta (pidió alto contraste, no "casi" alto contraste).
  if (settings.accent && !isHighContrastTheme()) html.style.setProperty('--accent', settings.accent);
  else html.style.removeProperty('--accent');

  if (settings.graphNormal && !isHighContrastTheme()) html.style.setProperty('--graph-normal', settings.graphNormal);
  else html.style.removeProperty('--graph-normal');
  if (settings.graphMeta && !isHighContrastTheme()) html.style.setProperty('--graph-meta', settings.graphMeta);
  else html.style.removeProperty('--graph-meta');
  if (settings.graphHighlight && !isHighContrastTheme()) html.style.setProperty('--graph-highlight', settings.graphHighlight);
  else html.style.removeProperty('--graph-highlight');
}

applySettings();

async function call(method, url, body) {
  let res;
  try {
    res = await fetch(url, {
      method,
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (err) {
    return { ok: false, error: `No se pudo conectar: ${err.message}` };
  }
  try {
    return await res.json();
  } catch {
    // respuesta no-JSON (ej. 404 plano de una ruta que no existe): no dejar
    // que esto se propague sin capturar, un llamador esperando el objeto
    // {ok, ...} de vuelta se quedaría colgado si esto lanza.
    return { ok: false, error: `${res.status} ${res.statusText}` };
  }
}

// Variante de call() para endpoints que responden en streaming (texto
// plano, no un JSON al final): lee el body como stream y le pasa cada
// chunk a onChunk apenas llega, para pintar avance real en vez de un
// spinner ciego hasta que todo termine. Devuelve {ok} según el código
// "[EXIT:N]" que el propio endpoint escribe al final (ver
// /api/remember-batch/stream en dashboard-server.mjs).
async function callStream(url, body, onChunk) {
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  } catch (err) {
    onChunk(`No se pudo conectar: ${err.message}`);
    return { ok: false };
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const text = decoder.decode(value, { stream: true });
    full += text;
    onChunk(text);
  }
  const m = full.match(/\[EXIT:(-?\d+)\]\s*$/);
  return { ok: res.ok && m !== null && m[1] === '0', raw: full };
}

// Ingesta de un lote con avance en vivo: usa el botón "run" de la sección
// (busca [id$=-run]) para mostrar contador de progreso, deshabilitarlo
// mientras corre, y pintar cada línea de remember-batch.mjs (embedding,
// clasificador, "Registrado #N") apenas llega, no solo el resumen final.
async function runRememberBatchStream(sec, body, btn) {
  const total = body.records.length;
  let pre = sec.querySelector('pre.out');
  if (!pre) { pre = document.createElement('pre'); pre.className = 'out'; sec.appendChild(pre); }
  pre.className = 'out';
  pre.textContent = `Ingiriendo 0/${total}...\n`;
  const origLabel = btn.textContent;
  btn.disabled = true;
  let done = 0;
  const result = await callStream('/api/remember-batch/stream', body, (chunk) => {
    pre.textContent += chunk;
    pre.scrollTop = pre.scrollHeight;
    const matches = chunk.match(/^\[\d+\/\d+\]/gm);
    if (matches) done += matches.length;
    if (done > 0) btn.textContent = `Ingiriendo ${Math.min(done, total)}/${total}...`;
  });
  pre.className = 'out ' + (result.ok ? 'ok' : 'err');
  btn.disabled = false;
  btn.textContent = origLabel;
  return result;
}

function section(id, title, hint, bodyHtml) {
  const sec = document.createElement('section');
  sec.id = id;
  sec.innerHTML = `<h2>${title}</h2><p class="hint">${hint}</p>${bodyHtml}`;
  main.appendChild(sec);
  return sec;
}

// --- Buscar ---
// Por defecto muestra la respuesta SINTETIZADA (a partir de search.mjs, con
// el proveedor/modelo elegido en Configuración), no los fragmentos crudos --
// decisión del usuario el 2026-09-03 tras comparar la salida cruda del
// dashboard contra la misma pregunta vía MyMCP en Obsidian/Neural Composer:
// la respuesta redactada es lo que de verdad se quiere leer, los fragmentos
// crudos son la excepción para verificar una cita, no el caso por defecto.
// "Ver datos crudos" los muestra sin volver a buscar (ya se pidieron ambos
// en la misma corrida).
{
  const sec = section('search', 'Buscar', 'Busca en páginas y registros combinando texto y significado ("search.mjs") y redacta una respuesta a partir de los fragmentos encontrados. El proveedor/modelo de la síntesis se elige en Configuración. Activa "Ver datos crudos" para ver los fragmentos originales (sin redactar) en vez de o además de la respuesta. Escribe "#123" (o varios separados por coma, ej. "#94, #95") para traer esos registros por id exacto ("get-records.mjs"), sin buscar ni sintetizar.',
    `<label>Pregunta</label><input type="text" id="search-q" placeholder="ej. presupuesto del proyecto Atlas, o #123">
     <div class="checkline" style="margin-top:10px"><input type="checkbox" id="search-raw"><label for="search-raw">Ver datos crudos</label></div>
     <button class="run" id="search-run">Buscar</button>
     <div id="search-answer"></div>
     <div id="search-raw-box" style="display:none; margin-top:16px"></div>`);

  const answerEl = sec.querySelector('#search-answer');
  const rawBox = sec.querySelector('#search-raw-box');
  const rawCheckbox = sec.querySelector('#search-raw');

  function renderAnswer(text, isError) {
    answerEl.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'out out-md ' + (isError ? 'err' : 'ok');
    box.innerHTML = isError ? escapeHtml(text) : renderMarkdown(text);
    answerEl.appendChild(box);
  }

  function renderRaw(text, isError) {
    rawBox.innerHTML = '';
    const pre = document.createElement('pre');
    pre.className = 'out ' + (isError ? 'err' : 'ok');
    pre.textContent = text;
    rawBox.appendChild(pre);
  }

  rawCheckbox.addEventListener('change', () => {
    rawBox.style.display = rawCheckbox.checked ? 'block' : 'none';
  });

  // "#123" o "#94, #95" trae esos registros por id exacto (get-records.mjs), sin
  // buscar ni sintetizar -- Oscar no podía ubicar un registro por número desde
  // el dashboard (tenía que ir a Supabase directo), pese a que get-records.mjs
  // y /api/records ya existían para exactamente esto, solo faltaba el atajo
  // en la UI de Buscar.
  const FACT_ID_PATTERN = /^#?\d+(\s*,\s*#?\d+)*$/;

  sec.querySelector('#search-run').addEventListener('click', async () => {
    const q = sec.querySelector('#search-q').value.trim();
    if (!q) return;
    answerEl.innerHTML = '<p class="hint">Buscando…</p>';
    rawBox.innerHTML = '';
    rawBox.style.display = rawCheckbox.checked ? 'block' : 'none';

    if (FACT_ID_PATTERN.test(q)) {
      const ids = q.split(',').map((s) => s.trim().replace(/^#/, '')).join(',');
      const r = await call('GET', '/api/records?id=' + encodeURIComponent(ids));
      const text = r.ok ? (r.stdout || 'Ningún id existe.') : (r.stderr || r.error || 'get-records.mjs falló');
      renderRaw(text, !r.ok);
      renderAnswer(text, !r.ok);
      return;
    }

    const r = await call('GET', '/api/search?q=' + encodeURIComponent(q));
    if (!r.ok) {
      renderAnswer(r.stderr || r.error || 'search.mjs falló', true);
      return;
    }
    const raw = r.stdout || '';
    renderRaw(raw || '(sin resultados)', false);
    if (!raw.trim()) {
      renderAnswer('Sin resultados para esa pregunta.', false);
      return;
    }

    answerEl.innerHTML = '<p class="hint">Sintetizando…</p>';
    const provider = settings.searchSynthProvider;
    const model = settings.searchSynthModel || undefined;
    const synth = await call('POST', '/api/synthesize', { query: q, rawResults: raw, provider, model });
    renderAnswer(synth.ok ? synth.answer : `Error al sintetizar: ${synth.error}. Activa "Ver datos crudos" para ver los fragmentos sin redactar.`, !synth.ok);
  });
}

// --- Timeline ---
// Vista visual (2026-09-07, primera versión: línea de puntos por registro
// agrupada por mes + franja de densidad arriba). Ampliada dos veces el
// mismo día tras comparar contra una lista de mejoras que otro LLM había
// prometido y no implementó (ver conversación). Segunda ronda, lo que
// faltaba de esa lista:
// - Agrupación Año -> Mes (antes solo Mes): mismo patrón de <details>
//   perezoso, un nivel más arriba.
// - Filtro/resaltado en cliente (#tl-filter): sobre las filas ya
//   descargadas, sin volver a pedirle nada al servidor. Sintaxis
//   "kind:evento" para filtrar por tipo, cualquier otro texto busca en
//   claim/fuente/recuerdos y resalta la primera coincidencia con <mark>.
//   Si la coincidencia solo está en el historial de una cadena (no en la
//   versión vigente), esa cadena se muestra con el historial ya
//   desplegado, no forzaría a abrirlo el usuario para encontrar por qué
//   apareció en el filtro.
// - Vista "Gráfico" (d3, zoomable): eje de tiempo horizontal, un carril
//   por kind, zoom con rueda/arrastre (d3.zoom + rescaleX, mismo patrón
//   que la sección Grafo). El tamaño del punto crece con el largo del
//   claim, los reemplazados salen más tenues.
// - Vista "Heatmap": calendario estilo GitHub (semanas en columnas, días
//   en filas), color por cantidad de registros ese día. Clic en un día
//   con actividad cambia a la vista Lista mostrando solo esos registros
//   (día completo, sin agrupar por cadena -- "qué pasó ese día" es una
//   pregunta distinta a "cuál es el estado vigente de cada hecho").
{
  const sec = section('timeline', 'Timeline', 'Recorre los registros de un recuerdo (o de todo el sistema) en orden cronológico ("timeline.mjs"). No es un buscador para preguntas nuevas -- para eso usa "Buscar" -- pero sí filtra sobre lo ya cargado con el campo de abajo. Déjalo vacío para ver los más recientes de todo el sistema. Con "Incluir reemplazados" activo, una cadena de versiones de un mismo hecho se muestra como una sola entrada con un enlace "Ver evolución".',
    `<label>Recuerdo (opcional, empieza a escribir para ver sugerencias)</label>
     <input type="text" id="tl-memory" placeholder="ej. segundo-cerebro" list="tl-memories-list">
     <datalist id="tl-memories-list"></datalist>
     <div class="checkline"><input type="checkbox" id="tl-all"><label for="tl-all">Incluir reemplazados (--all)</label></div>
     <button class="run" id="tl-run">Ver</button>

     <div class="tl-view-toggle">
       <button type="button" class="tl-view-btn active" data-view="list">Lista</button>
       <button type="button" class="tl-view-btn" data-view="chart">Gráfico</button>
       <button type="button" class="tl-view-btn" data-view="heatmap">Heatmap</button>
     </div>
     <label style="margin-top:12px">Filtrar lo ya cargado</label>
     <input type="text" id="tl-filter" placeholder='texto libre, o "kind:evento" / "kind:commitment" / "kind:fact"'>

     <div id="tl-stats" class="gph-stats" style="margin-top:14px"></div>
     <div id="tl-density" class="tl-density"></div>

     <div id="tl-view-list-box"><div id="tl-line" class="tl-line"></div></div>
     <div id="tl-view-chart-box" style="display:none; position:relative"></div>
     <div id="tl-view-heatmap-box" class="tl-heatmap-scroll" style="display:none"></div>`);

  const statsEl = sec.querySelector('#tl-stats');
  const densityEl = sec.querySelector('#tl-density');
  const lineEl = sec.querySelector('#tl-line');
  const chartEl = sec.querySelector('#tl-view-chart-box');
  const heatmapEl = sec.querySelector('#tl-view-heatmap-box');
  const filterInput = sec.querySelector('#tl-filter');
  const viewBoxes = {
    list: sec.querySelector('#tl-view-list-box'),
    chart: chartEl,
    heatmap: heatmapEl,
  };
  const viewButtons = sec.querySelectorAll('.tl-view-btn');
  const MONTHS_PAGE_SIZE = 3;
  const ENTRIES_PAGE_SIZE = 25;

  let allRows = [];
  let dayFilter = null; // 'YYYY-MM-DD' o null
  let currentView = 'list';

  call('GET', '/api/memories').then((r) => {
    const list = sec.querySelector('#tl-memories-list');
    for (const n of r.memories ?? []) {
      const opt = document.createElement('option');
      opt.value = n.name;
      list.appendChild(opt);
    }
  });

  const MONTH_FMT = new Intl.DateTimeFormat('es-CO', { year: 'numeric', month: 'long', timeZone: 'UTC' });
  const MONTH_SHORT_FMT = new Intl.DateTimeFormat('es-CO', { month: 'short', timeZone: 'UTC' });
  const DAY_FMT = new Intl.DateTimeFormat('es-CO', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
  const KIND_LABELS = { fact: 'Hecho', event: 'Evento', commitment: 'Compromiso' };

  function statTile(value, label) {
    const div = document.createElement('div');
    div.className = 'gph-stat';
    div.innerHTML = `<b>${value}</b><span>${escapeHtml(label)}</span>`;
    return div;
  }

  // Envuelve por palabra a `width` caracteres por línea (sin cortar
  // palabras a la mitad); el resultado lleva "\n" reales, se renderiza con
  // white-space: pre-wrap en el tooltip del Gráfico.
  function wrapText(text, width) {
    const words = (text || '').split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (const w of words) {
      const candidate = line ? `${line} ${w}` : w;
      if (candidate.length > width && line) {
        lines.push(line);
        line = w;
      } else {
        line = candidate;
      }
    }
    if (line) lines.push(line);
    return lines.join('\n');
  }

  function highlightMatch(text, query) {
    const safe = text || '';
    if (!query) return escapeHtml(safe);
    const idx = safe.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(safe);
    return escapeHtml(safe.slice(0, idx)) + '<mark class="tl-hl">' + escapeHtml(safe.slice(idx, idx + query.length)) + '</mark>' + escapeHtml(safe.slice(idx + query.length));
  }

  // Reconstruye cadenas de versión a partir de superseded_by: cada fila sin
  // superseded_by es la cabeza (vigente) de una cadena, se camina hacia
  // atrás buscando quién apunta a ella (predecessorOf) hasta agotar el
  // historial disponible en este dataset. Sin --all todas las filas ya
  // vienen con superseded_by null, cada cadena queda de largo 1.
  function buildChains(rows) {
    const predecessorOf = new Map();
    for (const r of rows) {
      if (r.superseded_by != null) predecessorOf.set(String(r.superseded_by), r);
    }
    const consumed = new Set();
    const chains = [];
    for (const r of rows) {
      if (r.superseded_by == null) {
        const chain = [r];
        consumed.add(String(r.id));
        let cur = r;
        while (predecessorOf.has(String(cur.id))) {
          const prev = predecessorOf.get(String(cur.id));
          if (consumed.has(String(prev.id))) break; // guarda contra datos inconsistentes/ciclos
          chain.unshift(prev);
          consumed.add(String(prev.id));
          cur = prev;
        }
        chains.push(chain);
      }
    }
    // Filas reemplazadas cuyo sucesor no vino en este dataset (huérfanas,
    // ej. al filtrar por un recuerdo que solo alguna versión de la cadena
    // tiene asignado): se muestran como su propia cadena de largo 1.
    for (const r of rows) {
      if (!consumed.has(String(r.id))) chains.push([r]);
    }
    return chains;
  }

  // "kind:evento resto del texto" -> { kind: 'evento', text: 'resto del texto' };
  // cualquier otra cosa -> { kind: null, text: <todo el query> }.
  function parseQuery(raw) {
    const q = (raw || '').trim();
    if (!q) return null;
    const m = q.match(/^kind:(\S+)\s*(.*)$/i);
    if (m) return { kind: m[1].toLowerCase(), text: m[2].trim() };
    return { kind: null, text: q };
  }

  function entryMatchesText(entry, textLower) {
    if (!textLower) return true;
    const hay = `${entry.claim || ''} ${entry.source || ''} ${entry.memories || ''}`.toLowerCase();
    return hay.includes(textLower);
  }

  // Filtra cadenas ya construidas: conserva una cadena si su cabeza o
  // cualquier versión de su historial coincide. Si la coincidencia de
  // texto solo está en el historial, se marca para forzar su despliegue
  // (forceOpenHistory) -- si no, el usuario vería una cadena en los
  // resultados sin poder ver por qué calificó.
  function filterChains(chains, parsed) {
    if (!parsed) return { chains, forceOpenHistory: new Set() };
    const textLower = parsed.text.toLowerCase();
    const kept = [];
    const forceOpenHistory = new Set();
    for (const chain of chains) {
      const head = chain[chain.length - 1];
      if (parsed.kind && (head.kind || 'fact').toLowerCase() !== parsed.kind) continue;
      const headMatches = entryMatchesText(head, textLower);
      const historyMatchIdx = chain.slice(0, -1).findIndex((h) => entryMatchesText(h, textLower));
      if (headMatches || historyMatchIdx !== -1) {
        kept.push(chain);
        if (!headMatches && historyMatchIdx !== -1) forceOpenHistory.add(head.id);
      }
    }
    return { chains: kept, forceOpenHistory };
  }

  function chainEntryHtml(chain, opts = {}) {
    const { highlightQuery = null, forceOpen = false } = opts;
    const head = chain[chain.length - 1];
    const history = chain.slice(0, -1);
    const reemplazadoHead = Boolean(head.valid_until);
    const kindClass = `tl-kind-${escapeHtml(head.kind || 'fact')}`;
    const memoriesNote = head.memories ? ` · recuerdos: ${escapeHtml(head.memories)}` : '';
    const replacedNote = reemplazadoHead ? ` · reemplazado por #${head.superseded_by}` : '';
    const label = `Ver evolución (${history.length} ${history.length === 1 ? 'versión anterior' : 'versiones anteriores'})`;
    const historyHtml = history.length
      ? `<span class="tl-history-toggle" data-chain-toggle data-open-label="${escapeHtml(label)}">${forceOpen ? 'Ocultar evolución' : escapeHtml(label)}</span>
         <div class="tl-history${forceOpen ? ' open' : ''}">${history.map((h) => `
           <div class="tl-history-item">
             <div class="tl-entry-date">#${h.id} · ${DAY_FMT.format(new Date(h.date))}</div>
             <div class="tl-entry-claim">${highlightMatch(h.claim, highlightQuery)}</div>
           </div>`).join('')}</div>`
      : '';
    return `
      <div class="tl-entry ${kindClass}${reemplazadoHead ? ' tl-reemplazado' : ''}">
        <div class="tl-entry-date">#${head.id} · ${DAY_FMT.format(new Date(head.date))}</div>
        <div class="tl-entry-claim">${highlightMatch(head.claim, highlightQuery)}</div>
        <div class="tl-entry-meta">fuente: ${escapeHtml(head.source || '')} · tipo: ${escapeHtml(head.kind || 'fact')}${memoriesNote}${replacedNote}</div>
        ${historyHtml}
      </div>`;
  }

  // Delegación única sobre lineEl (sobrevive a que su contenido se
  // reconstruya en cada render, un listener por render duplicaría clics).
  lineEl.addEventListener('click', (e) => {
    const back = e.target.closest('#tl-day-back');
    if (back) { dayFilter = null; renderAll(); return; }
    const toggle = e.target.closest('[data-chain-toggle]');
    if (!toggle) return;
    const hist = toggle.nextElementSibling;
    const opening = !hist.classList.contains('open');
    hist.classList.toggle('open', opening);
    toggle.textContent = opening ? 'Ocultar evolución' : toggle.dataset.openLabel;
  });

  function renderStatsAndDensity(rows) {
    statsEl.innerHTML = '';
    densityEl.innerHTML = '';
    const vigentes = rows.filter((r) => !r.valid_until).length;
    statsEl.appendChild(statTile(rows.length, 'registros'));
    statsEl.appendChild(statTile(vigentes, 'vigentes'));
    statsEl.appendChild(statTile(rows.length - vigentes, 'reemplazados'));

    // Densidad por mes: cuenta registros crudos (no cadenas), es una medida
    // de actividad de escritura, no de cuántas entradas se van a pintar.
    const byMonthCount = new Map();
    for (const r of rows) {
      const key = r.date.slice(0, 7);
      byMonthCount.set(key, (byMonthCount.get(key) ?? 0) + 1);
    }
    const maxCount = Math.max(...byMonthCount.values());
    for (const key of [...byMonthCount.keys()].reverse()) {
      const count = byMonthCount.get(key);
      const bar = document.createElement('div');
      bar.className = 'tl-density-bar';
      bar.style.height = Math.max(8, Math.round((count / maxCount) * 36)) + 'px';
      bar.title = `${MONTH_FMT.format(new Date(key + '-01T00:00:00Z'))}: ${count}`;
      densityEl.appendChild(bar);
    }
  }

  // Agrupa cadenas por Año -> Mes (según la fecha de su cabeza, la versión
  // vigente: una cadena "vive" donde está su estado actual, su historial
  // se ve al desplegarla, no donde ocurrió cada versión individual).
  function groupChainsByYearMonth(chains) {
    const byYear = new Map();
    for (const chain of chains) {
      const dateStr = chain[chain.length - 1].date;
      const year = dateStr.slice(0, 4), month = dateStr.slice(0, 7);
      if (!byYear.has(year)) byYear.set(year, new Map());
      const byMonth = byYear.get(year);
      if (!byMonth.has(month)) byMonth.set(month, []);
      byMonth.get(month).push(chain);
    }
    for (const byMonth of byYear.values()) {
      for (const list of byMonth.values()) list.sort((a, b) => b[b.length - 1].date.localeCompare(a[a.length - 1].date));
    }
    return byYear;
  }

  function renderListView(chains, { highlightQuery = null, forceOpenHistorySet = new Set(), openAll = false } = {}) {
    lineEl.innerHTML = '';
    if (!chains.length) {
      lineEl.innerHTML = '<p class="hint">Sin coincidencias.</p>';
      return;
    }
    const byYear = groupChainsByYearMonth(chains);
    const years = [...byYear.keys()].sort().reverse();

    years.forEach((year, yi) => {
      const byMonth = byYear.get(year);
      const months = [...byMonth.keys()].sort().reverse();
      const totalInYear = months.reduce((sum, m) => sum + byMonth.get(m).length, 0);

      const yearDetails = document.createElement('details');
      yearDetails.className = 'tl-year-group';
      yearDetails.open = openAll || yi === 0;
      yearDetails.innerHTML = `<summary>${year} <span class="tl-month-count">(${totalInYear})</span></summary><div class="tl-year-content"></div>`;
      const yearContent = yearDetails.querySelector('.tl-year-content');

      let renderedMonths = 0;
      function renderMonthBatch() {
        const batchSize = openAll ? months.length : MONTHS_PAGE_SIZE;
        const start = renderedMonths;
        const end = Math.min(start + batchSize, months.length);
        for (let i = start; i < end; i++) {
          const monthKey = months[i];
          const chainsInMonth = byMonth.get(monthKey);
          const monthDetails = document.createElement('details');
          monthDetails.className = 'tl-month-group';
          monthDetails.open = openAll || (yi === 0 && i === 0);
          monthDetails.innerHTML = `<summary>${MONTH_FMT.format(new Date(monthKey + '-01T00:00:00Z'))} <span class="tl-month-count">(${chainsInMonth.length})</span></summary><div class="tl-month-content"></div>`;
          const content = monthDetails.querySelector('.tl-month-content');

          let renderedEntries = 0;
          function renderEntryBatch() {
            const size = openAll ? chainsInMonth.length : ENTRIES_PAGE_SIZE;
            const nextChains = chainsInMonth.slice(renderedEntries, renderedEntries + size);
            for (const chain of nextChains) {
              const forceOpen = forceOpenHistorySet.has(chain[chain.length - 1].id);
              content.insertAdjacentHTML('beforeend', chainEntryHtml(chain, { highlightQuery, forceOpen }));
            }
            renderedEntries += nextChains.length;
            content.querySelector('.tl-load-more')?.remove();
            if (renderedEntries < chainsInMonth.length) {
              const btn = document.createElement('button');
              btn.className = 'tl-load-more';
              btn.textContent = `Cargar ${Math.min(ENTRIES_PAGE_SIZE, chainsInMonth.length - renderedEntries)} más de este mes`;
              btn.addEventListener('click', renderEntryBatch);
              content.appendChild(btn);
            }
          }

          let opened = false;
          monthDetails.addEventListener('toggle', () => {
            if (monthDetails.open && !opened) { opened = true; renderEntryBatch(); }
          });
          if (monthDetails.open) { opened = true; renderEntryBatch(); }
          yearContent.appendChild(monthDetails);
        }
        renderedMonths = end;

        yearContent.querySelector('.tl-load-more-months')?.remove();
        if (renderedMonths < months.length) {
          const btn = document.createElement('button');
          btn.className = 'tl-load-more tl-load-more-months';
          btn.textContent = `Cargar más meses (${months.length - renderedMonths} restantes)`;
          btn.addEventListener('click', renderMonthBatch);
          yearContent.appendChild(btn);
        }
      }

      let yearOpened = false;
      yearDetails.addEventListener('toggle', () => {
        if (yearDetails.open && !yearOpened) { yearOpened = true; renderMonthBatch(); }
      });
      if (yearDetails.open) { yearOpened = true; renderMonthBatch(); }
      lineEl.appendChild(yearDetails);
    });
  }

  // Vista de un día exacto (desde un clic en el heatmap): plana, sin
  // cadenas ni agrupar por mes -- "qué pasó este día" quiere ver todas las
  // versiones que hubo ese día, no solo el estado vigente de cada hecho.
  function renderDayView(day, rows) {
    const dayRows = rows.filter((r) => r.date.slice(0, 10) === day).sort((a, b) => b.id - a.id);
    lineEl.innerHTML = `<button type="button" class="tl-load-more" id="tl-day-back">← Volver a la vista completa</button>
      <div class="tl-month-header-plain">${DAY_FMT.format(new Date(day + 'T00:00:00Z'))} (${dayRows.length})</div>`;
    for (const r of dayRows) {
      lineEl.insertAdjacentHTML('beforeend', chainEntryHtml([r]));
    }
  }

  function setActiveViewButton(view) {
    viewButtons.forEach((b) => b.classList.toggle('active', b.dataset.view === view));
    for (const [key, el] of Object.entries(viewBoxes)) el.style.display = key === view ? '' : 'none';
  }
  viewButtons.forEach((btn) => btn.addEventListener('click', () => {
    currentView = btn.dataset.view;
    setActiveViewButton(currentView);
    renderAll();
  }));
  filterInput.addEventListener('input', () => { if (currentView !== 'heatmap') renderAll(); });

  // --- Vista Gráfico (d3, zoomable) ---
  // Eje de tiempo horizontal, un carril por kind, zoom con rueda/arrastre
  // (mismo patrón que la sección Grafo: d3.zoom + rescaleX sobre la escala
  // de tiempo, no sobre un <g> completo, porque aquí solo el eje X debe
  // reescalarse). El radio de cada punto crece un poco con el largo del
  // claim (más contenido, punto más grande), los reemplazados salen a
  // media opacidad para que la vigente "gane" visualmente.
  function renderChart(rows, rawQuery) {
    chartEl.innerHTML = '';
    if (!rows.length) { chartEl.innerHTML = '<p class="hint">Sin registros para graficar.</p>'; return; }

    const parsed = parseQuery(rawQuery);
    const textLower = parsed ? parsed.text.toLowerCase() : '';

    const W = 900, H = 260, M = { top: 16, right: 20, bottom: 28, left: 96 };
    const dates = rows.map((r) => new Date(r.date));
    const x = d3.scaleTime().domain(d3.extent(dates)).nice().range([M.left, W - M.right]);
    const lanes = ['fact', 'event', 'commitment'];
    const y = d3.scalePoint().domain(lanes).range([M.top, H - M.bottom]).padding(1);

    const svg = d3.select(chartEl).append('svg')
      .attr('viewBox', `0 0 ${W} ${H}`).attr('width', '100%').style('display', 'block');

    const clipId = 'tl-chart-clip-' + Math.random().toString(36).slice(2, 8);
    svg.append('defs').append('clipPath').attr('id', clipId).append('rect')
      .attr('x', M.left).attr('y', 0).attr('width', W - M.left - M.right).attr('height', H);

    const xAxisG = svg.append('g').attr('transform', `translate(0,${H - M.bottom})`);
    const yAxisG = svg.append('g').attr('transform', `translate(${M.left},0)`)
      .call(d3.axisLeft(y).tickFormat((k) => KIND_LABELS[k] || k));
    yAxisG.selectAll('text').attr('fill', 'var(--muted)').attr('font-size', 11);
    yAxisG.selectAll('path,line').attr('stroke', 'var(--border)');

    function drawXAxis(scale) {
      xAxisG.call(d3.axisBottom(scale).ticks(6)).selectAll('text').attr('fill', 'var(--muted)').attr('font-size', 10);
      xAxisG.selectAll('path,line').attr('stroke', 'var(--border)');
    }
    drawXAxis(x);

    const plotG = svg.append('g').attr('clip-path', `url(#${clipId})`);
    const pointsSel = plotG.selectAll('circle').data(rows).join('circle')
      .attr('cx', (d) => x(new Date(d.date)))
      .attr('cy', (d) => y(d.kind && lanes.includes(d.kind) ? d.kind : 'fact'))
      .attr('r', (d) => Math.min(9, 3 + Math.floor((d.claim || '').length / 120)))
      .attr('class', (d) => 'tl-chart-dot tl-kind-' + (d.kind || 'fact'))
      .style('opacity', (d) => {
        if (parsed) {
          if (parsed.kind && (d.kind || 'fact').toLowerCase() !== parsed.kind) return 0.12;
          if (!entryMatchesText(d, textLower)) return 0.12;
        }
        return d.valid_until ? 0.4 : 0.9;
      })
      .style('cursor', 'pointer');

    // Tooltip propio (no .gph-tooltip: ese es de una sola línea sin wrap,
    // pensado para el nombre corto de un recuerdo en el Grafo -- aquí el
    // claim puede ser largo, se envuelve a ~80 caracteres por línea y
    // sigue al puntero mientras se mueve dentro del punto, no solo al
    // entrar).
    const tooltip = d3.select(chartEl).append('div').attr('class', 'tl-chart-tooltip').style('display', 'none');
    function positionTooltip(event) {
      const rect = chartEl.getBoundingClientRect();
      const ttNode = tooltip.node();
      const ttW = ttNode.offsetWidth;
      const ttH = ttNode.offsetHeight;
      let left = event.clientX - rect.left + 14;
      let top = event.clientY - rect.top + 14;
      // Mide el tooltip ya renderizado (con su texto real) para decidir si
      // cabe a la derecha/abajo del puntero -- un margen fijo asumía un
      // ancho fijo y el tooltip se salía del contenedor con claims largos.
      if (left + ttW > rect.width - 4) left = event.clientX - rect.left - ttW - 14;
      if (top + ttH > rect.height - 4) top = event.clientY - rect.top - ttH - 14;
      tooltip.style('left', Math.max(4, left) + 'px').style('top', Math.max(4, top) + 'px');
    }
    pointsSel.on('mouseenter', function (event, d) {
      d3.select(this).raise();
      const header = `#${d.id} · ${DAY_FMT.format(new Date(d.date))}`;
      tooltip.style('display', 'block').html(`<b>${header}</b><br>${escapeHtml(wrapText(d.claim || '', 80))}`);
      positionTooltip(event);
    }).on('mousemove', positionTooltip)
      .on('mouseleave', () => tooltip.style('display', 'none'));

    const zoomBehavior = d3.zoom().scaleExtent([1, 80])
      .translateExtent([[M.left, 0], [W - M.right, H]])
      .extent([[M.left, 0], [W - M.right, H]])
      .on('zoom', (event) => {
        const newX = event.transform.rescaleX(x);
        drawXAxis(newX);
        pointsSel.attr('cx', (d) => newX(new Date(d.date)));
      });
    svg.call(zoomBehavior);
  }

  // --- Vista Heatmap (calendario estilo GitHub) ---
  function renderHeatmapView(rows) {
    heatmapEl.innerHTML = '';
    if (!rows.length) { heatmapEl.innerHTML = '<p class="hint">Sin registros para el heatmap.</p>'; return; }

    const dayCounts = new Map();
    for (const r of rows) {
      const day = r.date.slice(0, 10);
      dayCounts.set(day, (dayCounts.get(day) ?? 0) + 1);
    }
    const sortedDays = [...dayCounts.keys()].sort();
    const minDate = new Date(sortedDays[0] + 'T00:00:00Z');
    const maxDate = new Date(sortedDays[sortedDays.length - 1] + 'T00:00:00Z');
    const start = new Date(minDate);
    start.setUTCDate(start.getUTCDate() - start.getUTCDay()); // retrocede al domingo, estilo GitHub
    const totalDays = Math.round((maxDate - start) / 86400000) + 1;
    const totalWeeks = Math.ceil(totalDays / 7);
    const maxCount = Math.max(...dayCounts.values());

    function bucket(count) {
      if (!count) return 0;
      const ratio = count / maxCount;
      if (ratio > 0.75) return 4;
      if (ratio > 0.5) return 3;
      if (ratio > 0.25) return 2;
      return 1;
    }

    const monthLabels = document.createElement('div');
    monthLabels.className = 'tl-heatmap-months';
    const grid = document.createElement('div');
    grid.className = 'tl-heatmap-grid';

    let lastMonth = null;
    for (let w = 0; w < totalWeeks; w++) {
      const weekStart = new Date(start);
      weekStart.setUTCDate(weekStart.getUTCDate() + w * 7);
      const label = document.createElement('span');
      label.className = 'tl-heatmap-month-label';
      if (weekStart.getUTCMonth() !== lastMonth) {
        label.textContent = MONTH_SHORT_FMT.format(weekStart).replace('.', '');
        lastMonth = weekStart.getUTCMonth();
      }
      monthLabels.appendChild(label);

      const col = document.createElement('div');
      col.className = 'tl-heatmap-col';
      for (let d = 0; d < 7; d++) {
        const day = new Date(weekStart);
        day.setUTCDate(day.getUTCDate() + d);
        const dayKey = day.toISOString().slice(0, 10);
        const cell = document.createElement('div');
        if (day < minDate || day > maxDate) {
          cell.className = 'tl-heatmap-cell tl-heatmap-empty';
        } else {
          const count = dayCounts.get(dayKey) || 0;
          cell.className = `tl-heatmap-cell tl-heatmap-b${bucket(count)}`;
          cell.title = `${DAY_FMT.format(day)}: ${count} registro${count === 1 ? '' : 's'}`;
          if (count > 0) {
            cell.addEventListener('click', () => {
              dayFilter = dayKey;
              currentView = 'list';
              filterInput.value = '';
              setActiveViewButton('list');
              renderAll();
            });
          }
        }
        col.appendChild(cell);
      }
      grid.appendChild(col);
    }

    const legend = document.createElement('div');
    legend.className = 'tl-heatmap-legend';
    legend.innerHTML = `<span>Menos</span>${[0, 1, 2, 3, 4].map((b) => `<div class="tl-heatmap-cell tl-heatmap-b${b}"></div>`).join('')}<span>Más</span>`;

    heatmapEl.appendChild(monthLabels);
    heatmapEl.appendChild(grid);
    heatmapEl.appendChild(legend);
  }

  function renderAll() {
    if (!allRows.length) return;
    renderStatsAndDensity(allRows);
    setActiveViewButton(currentView);

    if (currentView === 'list') {
      if (dayFilter) {
        renderDayView(dayFilter, allRows);
      } else {
        const chains = buildChains(allRows);
        const parsed = parseQuery(filterInput.value);
        if (!parsed) {
          renderListView(chains, {});
        } else {
          const { chains: filtered, forceOpenHistory } = filterChains(chains, parsed);
          renderListView(filtered, { highlightQuery: parsed.text || null, forceOpenHistorySet: forceOpenHistory, openAll: true });
        }
      }
    } else if (currentView === 'chart') {
      renderChart(allRows, filterInput.value);
    } else if (currentView === 'heatmap') {
      renderHeatmapView(allRows);
    }
  }

  sec.querySelector('#tl-run').addEventListener('click', async () => {
    const memory = sec.querySelector('#tl-memory').value.trim();
    const all = sec.querySelector('#tl-all').checked;
    const params = new URLSearchParams();
    if (memory) params.set('memory', memory);
    if (all) params.set('all', '1');
    lineEl.innerHTML = '<p class="hint">Cargando...</p>';
    const r = await call('GET', '/api/timeline?' + params.toString());
    if (!r.ok) {
      statsEl.innerHTML = '';
      densityEl.innerHTML = '';
      lineEl.innerHTML = '';
      chartEl.innerHTML = '';
      heatmapEl.innerHTML = '';
      out(sec, r);
      return;
    }
    allRows = r.rows || [];
    dayFilter = null;
    filterInput.value = '';
    if (allRows.length === 0) {
      statsEl.innerHTML = '';
      densityEl.innerHTML = '';
      lineEl.innerHTML = '<p class="hint">Sin registros registrados.</p>';
      chartEl.innerHTML = '';
      heatmapEl.innerHTML = '';
      return;
    }
    renderAll();
  });
}

{
