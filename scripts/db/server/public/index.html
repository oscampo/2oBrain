// --- Grafo ---
// Grafo interactivo dirigido por fuerzas (d3-force, vendorizado localmente
// en vendor/d3.v7.min.js -- nada de CDN externo, "solo localhost" aplica
// también a dependencias del frontend). Reemplaza el layout jerárquico
// estático anterior (2026-09-03): el usuario lo pidió parecido a LightRAG/
// Obsidian tras ver que un layout fijo por niveles no aguanta un grafo con
// ciclos reales (ver PLAN-nodos.md) -- acá la física corre en el navegador
// y decide las posiciones sola, arrastrar/zoom/clic funcionan de verdad.
// El servidor (graph.mjs) solo entrega memories/edges en JSON, sin caché --
// cada refresco trae el estado vigente.
{
  const sec = section('graph', 'Grafo', 'Mapa interactivo de recuerdos y conexiones (memory_links) tal como existen ahora mismo en la base. Arrastra un recuerdo para reacomodarlo, usa la rueda del mouse para zoom, clic en un recuerdo para resaltar sus vecinos directos (clic de nuevo, o en un espacio vacío, para quitar el resaltado).',
    `<div class="row" style="align-items:flex-end; gap:10px">
       <div style="flex:0 0 auto"><button class="run" id="graph-run" style="margin-top:0">Refrescar</button></div>
       <div style="flex:0 0 auto"><button class="run secondary" id="graph-fit" style="margin-top:0">Encuadre</button></div>
       <div style="flex:1"><label style="margin:0 0 4px">Buscar recuerdo</label>
         <input type="text" id="graph-search" list="graph-memories-list" placeholder="empieza a escribir…"></div>
       <div style="flex:0 0 auto"><button class="run secondary" id="graph-search-go" style="margin-top:0">Ir</button></div>
     </div>
     <datalist id="graph-memories-list"></datalist>
     <div class="checkline"><input type="checkbox" id="graph-show-labels" checked><label for="graph-show-labels">Mostrar nombres de relaciones</label></div>
     <div class="gph-stats" id="graph-stats" style="margin-top:16px"></div>
     <div id="graph-canvas" style="position:relative; margin-top:12px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--panel)"></div>
     <div class="gph-legend" style="margin-top:10px">
       <div class="gph-legend-item"><span class="gph-dot"></span>recuerdo de dominio</div>
       <div class="gph-legend-item"><span class="gph-dot gph-meta"></span>recuerdo meta (sobre el propio sistema)</div>
     </div>`);

  const statsEl = sec.querySelector('#graph-stats');
  const canvasEl = sec.querySelector('#graph-canvas');
  const W = 1100, H = 700;
  let simulation = null;
  let graph = null; // estado del render vigente (recuerdos, selección d3, zoom) para los controles de fuera: encuadre, buscador, checkbox

  function radius(factCount) {
    return Math.max(16, Math.min(50, 16 + Math.sqrt(factCount) * 2.8));
  }

  // Mismo truco que el layout anterior: sin wrap nativo en SVG, se parte el
  // nombre por guiones en varias líneas (tspans) para que no se salga del recuerdo.
  function wrapLabel(name, maxCharsPerLine = 14) {
    const parts = name.split('-');
    const lines = [];
    let current = '';
    for (const part of parts) {
      const candidate = current ? `${current}-${part}` : part;
      if (candidate.length > maxCharsPerLine && current) {
        lines.push(current + '-');
        current = part;
      } else {
        current = candidate;
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  async function loadGraph() {
    canvasEl.innerHTML = '<p class="hint" style="padding:16px">Cargando…</p>';
    const r = await call('GET', '/api/graph');
    if (!r.ok) {
      canvasEl.innerHTML = `<pre class="out err">${escapeHtml(r.error || 'graph.mjs falló')}</pre>`;
      return;
    }
    renderGraph(r.memories, r.edges);
  }

  function edgeEndpointName(x) { return typeof x === 'object' ? x.name : x; }

  function renderGraph(rawNodes, rawEdges) {
    if (simulation) { simulation.stop(); simulation = null; }
    canvasEl.innerHTML = '';
    // El auto-encuadre solo debe disparar UNA vez, cuando la simulación
    // inicial se asienta -- no cada vez que "end" vuelve a dispararse tras
    // reactivarse (arrastrar un recuerdo hace simulation.alphaTarget(0.3).restart(),
    // que eventualmente vuelve a emitir "end" al enfriarse). Sin este freno,
    // la vista se resetea sola después de cada arrastre, o de un zoom registro
    // mientras la simulación inicial todavía no terminaba de asentarse.
    let hasAutoFitted = false;

    const touched = new Set();
    for (const e of rawEdges) { touched.add(e.from); touched.add(e.to); }
    const isolatedCount = rawNodes.filter((n) => !touched.has(n.name)).length;
    const metaCount = rawNodes.filter((n) => n.isMeta).length;
    statsEl.innerHTML = [
      [rawNodes.length, 'recuerdos'], [rawEdges.length, 'conexiones'], [touched.size, 'conectados'],
      [isolatedCount, 'sin conexión'], [metaCount, 'meta'],
    ].map(([n, label]) => `<div class="gph-stat"><b>${n}</b><span>${label}</span></div>`).join('');

    const memories = rawNodes.map((n) => ({ ...n }));
    const links = rawEdges.map((e) => ({ source: e.from, target: e.to, relation: e.relation }));

    const svg = d3.select(canvasEl).append('svg')
      .attr('viewBox', [0, 0, W, H]).attr('width', '100%').attr('height', 'auto')
      .style('display', 'block');

    svg.append('defs').html(`
      <marker id="gph-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="var(--border)" />
      </marker>`);

    const g = svg.append('g');
    const zoomBehavior = d3.zoom().scaleExtent([0.2, 4]).on('zoom', (event) => g.attr('transform', event.transform));
    svg.call(zoomBehavior);

    const linkSel = g.append('g').selectAll('line').data(links).join('line')
      .attr('class', 'gph-edge').attr('marker-end', 'url(#gph-arrow)');
    const linkLabelSel = g.append('g').selectAll('text').data(links).join('text')
      .attr('class', 'gph-edge-label').attr('text-anchor', 'middle').text((d) => d.relation);

    const nodeSel = g.append('g').selectAll('g').data(memories, (d) => d.name).join('g')
      .attr('class', (d) => 'gph-node' + (d.isMeta ? ' gph-meta' : ''))
      .style('cursor', 'grab');

    nodeSel.append('circle')
      .attr('class', (d) => 'gph-circle' + (d.isMeta ? ' gph-meta' : ''))
      .attr('r', (d) => radius(d.factCount));
    nodeSel.append('text').attr('class', 'gph-count').attr('text-anchor', 'middle').attr('dy', 4)
      .text((d) => d.factCount);
    nodeSel.each(function (d) {
      const r = radius(d.factCount);
      const text = d3.select(this).append('text').attr('class', 'gph-label').attr('text-anchor', 'middle').attr('y', r + 15);
      wrapLabel(d.name).forEach((line, i) => {
        text.append('tspan').attr('x', 0).attr('dy', i === 0 ? 0 : '1.15em').text(line);
      });
    });

    let highlighted = null;
    function applyHighlight() {
      if (!highlighted) {
        nodeSel.style('opacity', 1); linkSel.style('opacity', 1); linkLabelSel.style('opacity', 1);
        nodeSel.select('circle').classed('gph-circle-highlight', false);
        return;
      }
      const neighbors = new Set([highlighted]);
      for (const l of links) {
        const s = edgeEndpointName(l.source), t = edgeEndpointName(l.target);
        if (s === highlighted) neighbors.add(t);
        if (t === highlighted) neighbors.add(s);
      }
      // El resto del grafo baja a 0.6 (no 0.15) -- lo suficientemente
      // atenuado para que el resaltado destaque, pero sin volverse casi
      // invisible sobre fondo oscuro. Los recuerdos resaltados, además, cambian
      // a rojo (var(--err)) para que destaquen por color, no solo por opacidad.
      nodeSel.style('opacity', (d) => (neighbors.has(d.name) ? 1 : 0.6));
      nodeSel.select('circle').classed('gph-circle-highlight', (d) => neighbors.has(d.name));
      const edgeTouches = (l) => edgeEndpointName(l.source) === highlighted || edgeEndpointName(l.target) === highlighted;
      linkSel.style('opacity', (l) => (edgeTouches(l) ? 1 : 0.6));
      linkLabelSel.style('opacity', (l) => (edgeTouches(l) ? 1 : 0.6));
    }

    nodeSel.on('click', (event, d) => {
      event.stopPropagation();
      highlighted = highlighted === d.name ? null : d.name;
      applyHighlight();
    });
    svg.on('click', () => { highlighted = null; applyHighlight(); });

    nodeSel.on('contextmenu', (event, d) => {
      event.preventDefault();
      event.stopPropagation();
      showCtxMenu(event.clientX, event.clientY, d.name);
    });

    // Los nombres son ilegibles a este tamaño con varias docenas de recuerdos --
    // al pasar el mouse se muestra un tooltip HTML normal (no un <text> SVG
    // dentro de "g", que se agranda/encoge con el zoom igual que todo lo
    // demás -- un font-size fijo en SVG no queda fijo en pantalla si el
    // ancestro tiene una transformación de escala). El tooltip vive fuera
    // del <g> con zoom, así que su tamaño de fuente es el mismo sin importar
    // qué tan alejada esté la vista.
    const tooltip = d3.select(canvasEl).append('div')
      .attr('class', 'gph-tooltip').style('display', 'none');
    nodeSel.on('mouseenter', function (event, d) {
      d3.select(this).raise();
      const svgRect = svg.node().getBoundingClientRect();
      const canvasRect = canvasEl.getBoundingClientRect();
      const t = d3.zoomTransform(svg.node());
      const scaleX = svgRect.width / W, scaleY = svgRect.height / H;
      const screenX = (svgRect.left - canvasRect.left) + (t.x + d.x * t.k) * scaleX;
      const screenY = (svgRect.top - canvasRect.top) + (t.y + d.y * t.k) * scaleY;
      const screenR = radius(d.factCount) * t.k * scaleY;
      tooltip.style('left', screenX + 'px').style('top', (screenY - screenR - 8) + 'px')
        .style('display', 'block').text(d.name);
    }).on('mouseleave', function () {
      tooltip.style('display', 'none');
    });

    nodeSel.call(d3.drag()
      .on('start', (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

    function renderTick() {
      linkSel.attr('x1', (d) => d.source.x).attr('y1', (d) => d.source.y)
        .attr('x2', (d) => d.target.x).attr('y2', (d) => d.target.y);
      linkLabelSel.attr('x', (d) => (d.source.x + d.target.x) / 2).attr('y', (d) => (d.source.y + d.target.y) / 2 - 6);
      nodeSel.attr('transform', (d) => `translate(${d.x},${d.y})`);
    }

    // alphaDecay SIEMPRE normal: es lo que hace que el layout converja bien
    // separado (probado: alphaDecay alto no solo quita la animación, apaga
    // la física antes de que el charge/collide tengan tiempo de separar los
    //recuerdos, quedan amontonados; y el arrastre pierde la inercia porque
    // decae casi instantáneo incluso durante el drag, hallazgo real de
    // el usuario). "Reducir movimiento" adelanta la simulación entera de un
    // jalón (tick() manual en loop, sin pintar) antes del primer render, en
    // vez de tocar la física en sí: layout final idéntico, solo sin
    // animación visible de asentamiento. simulation.restart() al final deja
    // el arrastre con inercia normal después.
    simulation = d3.forceSimulation(memories)
      .force('link', d3.forceLink(links).id((d) => d.name).distance(95).strength(0.5))
      .force('charge', d3.forceManyBody().strength(-260))
      .force('center', d3.forceCenter(W / 2, H / 2))
      .force('collide', d3.forceCollide((d) => radius(d.factCount) + 14))
      .on('tick', renderTick)
      .on('end', () => {
        if (hasAutoFitted) return;
        hasAutoFitted = true;
        fitToView(false);
      });

    if (prefersReducedMotion()) {
      simulation.stop();
      for (let i = 0; i < 300 && simulation.alpha() > simulation.alphaMin(); i++) simulation.tick();
      renderTick();
      hasAutoFitted = true;
      fitToView(false);
      simulation.restart(); // alpha ya casi en 0 -- no anima nada visible, pero deja el arrastre con inercia normal
    }

    graph = {
      memories, svg, zoomBehavior, linkLabelSel,
      setHighlight: (name) => { highlighted = name; applyHighlight(); },
    };
    sec.querySelector('#graph-show-labels').dispatchEvent(new Event('change'));
  }

  // Encuadra la vista al bounding box actual de los recuerdos -- se llama sola
  // cuando la simulación se asienta (evento "end" de d3-force) y también a
  // mano con el botón "Encuadre", para volver a ver todo tras hacer zoom o
  // arrastrar recuerdos fuera de vista.
  function fitToView(animate = true) {
    if (!graph || graph.memories.length === 0) return;
    const pad = 60;
    const xs = graph.memories.map((n) => n.x ?? W / 2);
    const ys = graph.memories.map((n) => n.y ?? H / 2);
    const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
    const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
    const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
    const scale = Math.max(0.2, Math.min(4, Math.min(W / w, H / h)));
    const tx = W / 2 - scale * (minX + maxX) / 2;
    const ty = H / 2 - scale * (minY + maxY) / 2;
    const transform = d3.zoomIdentity.translate(tx, ty).scale(scale);
    const target = animate ? graph.svg.transition().duration(400) : graph.svg;
    target.call(graph.zoomBehavior.transform, transform);
  }

  function goToNode(name) {
    if (!graph) return;
    const node = graph.memories.find((n) => n.name === name);
    if (!node) return;
    const scale = 1.6;
    const transform = d3.zoomIdentity.translate(W / 2 - scale * node.x, H / 2 - scale * node.y).scale(scale);
    graph.svg.transition().duration(400).call(graph.zoomBehavior.transform, transform);
    graph.setHighlight(name);
  }

  // Menú contextual (clic derecho en un recuerdo): "Ver timeline" / "Ver estado
  // del recuerdo" -- en vez de duplicar la lógica de esas dos secciones acá,
  // cambia de pestaña con show(), precarga el campo de recuerdo, y dispara el
  // mismo botón "Ver"/"Ver estado" que ya existe ahí. Una sola instancia
  // del menú en el DOM (no una por renderGraph), colgada de document.body
  // para que su position:fixed no dependa del contenedor del grafo.
  const ctxMenu = document.createElement('div');
  ctxMenu.className = 'gph-ctx-menu';
  ctxMenu.innerHTML = `
    <button type="button" data-action="timeline">Ver timeline</button>
    <button type="button" data-action="memory-status">Ver estado del recuerdo</button>`;
  document.body.appendChild(ctxMenu);

  function hideCtxMenu() { ctxMenu.style.display = 'none'; }
  function showCtxMenu(x, y, memoryName) {
    ctxMenu.dataset.node = memoryName;
    ctxMenu.style.display = 'block';
    // clamp para que no se salga del viewport si el clic fue cerca del borde
    const menuW = 180, menuH = 76;
    ctxMenu.style.left = Math.min(x, window.innerWidth - menuW - 8) + 'px';
    ctxMenu.style.top = Math.min(y, window.innerHeight - menuH - 8) + 'px';
  }
  document.addEventListener('click', hideCtxMenu);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCtxMenu(); });
  ctxMenu.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const memoryName = ctxMenu.dataset.node;
      hideCtxMenu();
      if (btn.dataset.action === 'timeline') {
        show('timeline');
        document.querySelector('#tl-memory').value = memoryName;
        document.querySelector('#tl-run').click();
      } else {
        show('memory-status');
        document.querySelector('#ns-memory').value = memoryName;
        document.querySelector('#ns-run').click();
      }
    });
  });

  sec.querySelector('#graph-run').addEventListener('click', loadGraph);
  sec.querySelector('#graph-fit').addEventListener('click', () => fitToView(true));
  sec.querySelector('#graph-show-labels').addEventListener('change', (e) => {
    graph?.linkLabelSel.style('display', e.target.checked ? null : 'none');
  });
  sec.querySelector('#graph-search-go').addEventListener('click', () => {
    const name = sec.querySelector('#graph-search').value.trim();
    if (name) goToNode(name);
  });
  sec.querySelector('#graph-search').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); sec.querySelector('#graph-search-go').click(); }
  });
  call('GET', '/api/memories').then((r) => {
    const list = sec.querySelector('#graph-memories-list');
    for (const n of r.memories ?? []) {
      const opt = document.createElement('option');
      opt.value = n.name;
      list.appendChild(opt);
    }
  });
  loadGraph();
}

// --- Candidatos de categoría ---
// 2026-09-04: recuerdos de dominio sin lugar en la jerarquía (ni hijo ni padre de
// ningún pertenece_a) agrupados por similitud de sus registros -- ver
// list-category-candidates.mjs para el diseño completo y por qué quedó bajo
// demanda (el usuario la corre cuando siente el grafo desordenado) en vez de
// una sugerencia proactiva (idea descartada tras discutirla, mismo patrón
// que ya se probó y se abandonó con el hook Stop).
//
// Primera versión solo mostraba texto plano con comandos para copiar a una
// terminal -- Oscar notó que era el único candidato sin ninguna acción
// posible desde el dashboard, a diferencia de "Extraer de página". Esta
// versión arma una tarjeta por cluster (nombre sugerido editable, miembros
// con checkbox para excluir alguno) y crea + liga en el navegador
// (/api/create-memory, /api/memory-link) -- revisión humana obligatoria sigue
// intacta: nada se crea hasta pulsar el botón de la tarjeta.
{
  const sec = section('category-candidates', 'Candidatos de categoría', 'Recuerdos de dominio que no están ligados a nada en la jerarquía (ni son hijos ni son padres de otro recuerdo vía "pertenece_a"), agrupados por similitud temática de sus registros. Si el grupo encaja con una categoría/subcategoría ya existente (por el parecido con sus hijos actuales), se propone enlazarlo/anidarlo ahí en vez de crear una nueva -- editable, siempre puedes elegir "categoría nueva" en su lugar. Nada se crea solo: revisa/edita cada tarjeta y confirma.',
    `<button class="run" id="sc-run">Buscar candidatos</button>
     <div class="status" id="sc-info"></div>
     <datalist id="sc-memories-list"></datalist>
     <div id="sc-cards"></div>`);

  const runBtn = sec.querySelector('#sc-run');
  const infoEl = sec.querySelector('#sc-info');
  const cardsEl = sec.querySelector('#sc-cards');

  call('GET', '/api/memories').then((r) => {
    const list = sec.querySelector('#sc-memories-list');
    for (const n of r.memories ?? []) {
      const opt = document.createElement('option');
      opt.value = n.name;
      list.appendChild(opt);
    }
  });

  // Dos caminos posibles, elegibles con radio (revisión humana obligatoria:
  // la propuesta automática -- existingCategory si lo hubo, si no
  // categoría nueva -- viene preseleccionada, pero siempre se puede
  // cambiar antes de confirmar):
  //   - "existing": enlaza a una categoría ya existente. Un solo miembro
  //     se liga directo (categoría-recuerdo); más de uno primero crea una
  //     SUBCATEGORÍA nueva bajo esa categoría y liga ahí (categoría-
  //     subcategoría-recuerdo), no los liga sueltos a la categoría misma.
  //   - "new": categoría nueva de un solo nivel, con los miembros como
  //     hijos directos -- comportamiento original.
  function renderCluster(cluster, index) {
    const card = document.createElement('div');
    card.className = 'fact-card';
    const isGroup = cluster.members.length > 1;
    const membersHtml = cluster.members
      .map(
        (m) => `
      <div class="fc-top">
        <input type="checkbox" class="sc-member-include" data-name="${m.name.replace(/"/g, '&quot;')}" checked>
        <label>${m.name} (${m.factCount} registro(s))</label>
      </div>
      <div class="fc-fragment">"${(m.example ?? '').replace(/</g, '&lt;')}"</div>`,
      )
      .join('');

    const hasExistingMatch = Boolean(cluster.existingCategory);
    const modeName = `sc-mode-${index}`;
    const existingHint = hasExistingMatch
      ? `Sugerido: similitud ${cluster.existingSimilarity.toFixed(2)} con "${cluster.existingMatchedVia}".`
      : 'Sin coincidencia automática -- escribe una categoría existente si aplica.';

    card.innerHTML = `
      <label>Miembros a incluir (desmarca los que no apliquen)</label>
      ${membersHtml}

      <div class="fc-mode-row" style="margin-top:16px">
        <label><input type="radio" name="${modeName}" class="sc-mode" value="existing" ${hasExistingMatch ? 'checked' : ''}>
          ${isGroup ? 'Nueva subcategoría bajo categoría existente' : 'Enlazar a categoría existente'}</label>
        <label style="margin-left:16px"><input type="radio" name="${modeName}" class="sc-mode" value="new" ${hasExistingMatch ? '' : 'checked'}>
          Categoría nueva</label>
      </div>

      <div class="sc-existing-box" style="margin-top:10px">
        <label>Categoría existente</label>
        <input type="text" class="sc-existing-category" list="sc-memories-list" value="${cluster.existingCategory ?? ''}">
        <div class="hint" style="margin-top:4px">${existingHint}</div>
        ${isGroup ? `<label style="margin-top:10px">Nombre de la subcategoría nueva</label>
          <input type="text" class="sc-sub-name" value="${cluster.suggestedName ?? ''}" placeholder="nombre-en-kebab-case">` : ''}
      </div>

      <div class="sc-new-box" style="margin-top:10px; display:none">
        <label>Nombre de la categoría nueva${cluster.suggestedReasoning ? ` -- sugerido: ${cluster.suggestedReasoning}` : ''}</label>
        <input type="text" class="sc-new-name" value="${hasExistingMatch ? '' : (cluster.suggestedName ?? '')}" placeholder="nombre-en-kebab-case">
      </div>

      <div class="row" style="margin-top:14px">
        <div><label>Fecha</label><input type="date" class="sc-date"></div>
      </div>
      <label>Motivo</label>
      <input type="text" class="sc-reason" placeholder="ej. agrupa la infraestructura de GitHub Classroom, antes sin categoría">
      <button class="run secondary sc-create"></button>`;
    card.querySelector('.sc-date').value = todayBogota();

    const existingBox = card.querySelector('.sc-existing-box');
    const newBox = card.querySelector('.sc-new-box');
    const createBtn = card.querySelector('.sc-create');

    function currentMode() {
      return card.querySelector('.sc-mode:checked').value;
    }
    function refreshMode() {
      const existing = currentMode() === 'existing';
      existingBox.style.display = existing ? '' : 'none';
      newBox.style.display = existing ? 'none' : '';
      createBtn.textContent = existing
        ? (isGroup ? 'Crear subcategoría y ligar' : 'Enlazar a categoría existente')
        : 'Crear categoría y ligar';
    }
    card.querySelectorAll('.sc-mode').forEach((r) => r.addEventListener('change', refreshMode));
    refreshMode();

    createBtn.addEventListener('click', async () => {
      const date = card.querySelector('.sc-date').value;
      const reason = card.querySelector('.sc-reason').value.trim();
      const members = [...card.querySelectorAll('.sc-member-include')].filter((cb) => cb.checked).map((cb) => cb.dataset.name);
      if (members.length === 0) { out(card, { ok: false, stdout: '', stderr: 'No hay ningún miembro incluido.' }); return; }
      if (!reason) { out(card, { ok: false, stdout: '', stderr: 'Falta el motivo (queda como fuente de cada enlace).' }); return; }

      const mode = currentMode();
      let targetCategory; // a qué recuerdo se liga cada miembro al final
      let createFirst = null; // {name, parent} si hay que crear un recuerdo nuevo antes de ligar

      if (mode === 'existing') {
        const existingCategory = card.querySelector('.sc-existing-category').value.trim();
        if (!existingCategory) { out(card, { ok: false, stdout: '', stderr: 'Falta la categoría existente.' }); return; }
        if (isGroup) {
          const subName = card.querySelector('.sc-sub-name').value.trim();
          if (!subName) { out(card, { ok: false, stdout: '', stderr: 'Falta el nombre de la subcategoría.' }); return; }
          targetCategory = subName;
          createFirst = { name: subName, parent: existingCategory };
        } else {
          targetCategory = existingCategory; // un solo miembro: liga directo, nada que crear
        }
      } else {
        const newName = card.querySelector('.sc-new-name').value.trim();
        if (!newName) { out(card, { ok: false, stdout: '', stderr: 'Falta el nombre de la categoría.' }); return; }
        targetCategory = newName;
        createFirst = { name: newName, parent: null };
      }

      createBtn.disabled = true;
      const origLabel = createBtn.textContent;
      createBtn.textContent = 'Aplicando…';
      try {
        let lines = [];
        if (createFirst) {
          // force: true -- la desambiguación semántica de create-memory.mjs
          // compara el nombre nuevo contra recuerdos temáticamente parecidos,
          // pero acá la premisa del grupo YA es "parecido a estos miembros"
          // (o, en el caso de subcategoría, ya se decidió a mano), por
          // construcción -- sin esto, el chequeo bloquea el caso normal de
          // este flujo (visto en vivo probando esta misma tarjeta,
          // 2026-09-04). La colisión de nombre/alias sigue corriendo sin
          // --force, esa sí aplica igual aquí.
          const createPayload = { name: createFirst.name, force: true };
          if (createFirst.parent) { createPayload.parent = createFirst.parent; createPayload.date = date; createPayload.reason = reason; }
          const createResult = await call('POST', '/api/create-memory', createPayload);
          lines.push(createResult.stdout);
          if (!createResult.ok) { out(card, { ok: false, stdout: lines.join('\n'), stderr: createResult.stderr || createResult.error || '' }); return; }
        }
        let anyFailed = false;
        for (const member of members) {
          const linkResult = await call('POST', '/api/memory-link', { from: member, to: targetCategory, relation: 'pertenece_a', date, reason });
          lines.push(linkResult.stdout || linkResult.stderr || linkResult.error);
          if (!linkResult.ok) anyFailed = true;
        }
        out(card, { ok: !anyFailed, stdout: lines.join('\n'), stderr: '' });
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = origLabel;
      }
    });

    return card;
  }

  runBtn.addEventListener('click', async () => {
    cardsEl.innerHTML = '';
    runBtn.disabled = true;
    infoEl.textContent = 'Buscando (compara embeddings de registros y pide una sugerencia de nombre por cluster, puede tardar)…';
    try {
      const r = await call('GET', '/api/category-candidates');
      if (!r.ok) { infoEl.textContent = 'Error: ' + r.error; return; }
      const unclustered = r.unclustered ?? [];
      infoEl.textContent = `${r.orphanCount} recuerdo(s) sin lugar en la jerarquía -- ${r.clusters.length} cluster(es) candidato(s), ${unclustered.length} huérfano(s) sin agrupar.`;
      r.clusters.forEach((cluster, i) => cardsEl.appendChild(renderCluster(cluster, i)));
      // Huérfanos sin cluster (2026-09-06, hallazgo de Oscar): antes no se
      // mostraba ni un nombre cuando ninguno superaba el umbral con otro --
      // se renderizan igual, cada uno como su propia tarjeta de 1 miembro,
      // misma acción que un cluster real.
      unclustered.forEach((single, i) => cardsEl.appendChild(renderCluster(single, r.clusters.length + i)));
    } finally {
      runBtn.disabled = false;
    }
  });
}

// --- Crear categoría/subcategoría ---
// create-memory.mjs (ya existía, usado hasta ahora solo desde "Candidatos de
// categoría"): esto expone el mismo comando directo, para cuando Oscar ya
// sabe el nombre que quiere y no necesita que el sistema se lo sugiera.
// Categoría/subcategoría no son un constructo de esquema aparte, son
// recuerdos ordinarios (tabla memories) conectados por convención vía
// memory_links con relation='pertenece_a' -- por eso "Categoría padre" es
// opcional: vacío crea una categoría de nivel superior (recuerdo sin
// padre), lleno crea una subcategoría (recuerdo + enlace pertenece_a en el
// mismo paso, mismo mecanismo que --parent de create-memory.mjs).
{
  const sec = section('create-memory', 'Crear categoría/subcategoría', 'Crea un recuerdo nuevo pensado como categoría o subcategoría ("create-memory.mjs"). Deja "Categoría padre" vacío para una categoría de nivel superior, o elígela para crear una subcategoría ligada a ella (pertenece_a). Antes de insertar, revisa que no exista ya algo parecido (mismo filtro de nombre/alias y de semántica que usa la creación automática).',
    `<label>Nombre</label><input type="text" id="cm-name" placeholder="ej. rutina-espiritual">
     <label style="margin-top:16px">Alias (opcional, separados por coma)</label><input type="text" id="cm-aliases" placeholder="ej. vida-espiritual">
     <label style="margin-top:16px">Categoría padre (opcional -- vacío = categoría de nivel superior)</label>
     <input type="text" id="cm-parent" placeholder="ej. rutina-diaria" list="cm-memories-list">
     <datalist id="cm-memories-list"></datalist>
     <div id="cm-parent-fields" style="display:none">
       <label style="margin-top:16px">Fecha</label><input type="date" id="cm-date">
       <label style="margin-top:16px">Motivo (opcional)</label><input type="text" id="cm-reason" placeholder="deja vacío para el motivo por defecto">
     </div>
     <div class="checkline" style="margin-top:16px">
       <input type="checkbox" id="cm-force">
       <label for="cm-force">Forzar (--force, salta el bloqueo por parecido semántico)</label>
     </div>
     <button class="run" id="cm-run" style="margin-top:16px">Crear</button>
     <div class="status" id="cm-status"></div>`);

  call('GET', '/api/memories').then((r) => {

// --- Cambiar tipo de registro ---
// set-record-kind.mjs, 2026-09-06: nace de un caso real (compromisos
// #94/#95/#96/#145 guardados con kind='commitment' cuando en realidad
// describían un estado ya aplicado, no una acción pendiente) -- hasta ahora
// esto se corregía a mano vía SQL directo, sin ninguna herramienta ni de
// dashboard ni de CLI. Distinto de Recategorizar (que mueve el registro a
// otro recuerdo): esto solo cambia la etiqueta hecho/evento/compromiso, sin
// tocar a qué recuerdo pertenece. Mismo patrón previsualizar-antes-de-
// habilitar que Retractar/Borrar registro -- no es destructivo, pero
// confirmar el texto real evita cambiar el registro equivocado.
{
  const sec = section('set-kind', 'Cambiar tipo de registro', 'Cambia la etiqueta hecho/evento/compromiso de uno o más registros ("set-record-kind.mjs"), sin tocar su recuerdo ni su contenido. Solo funciona sobre registros vigentes (retráctalos primero si ya no aplican). Para reasignar a otro recuerdo, usa "Recategorizar registro".',
    `<label>Id(s) (separados por coma)</label><input type="text" id="sk-id" placeholder="94,95,96">
     <button class="run secondary" id="sk-preview" style="margin-top:8px">Ver registro(s)</button>
     <label style="margin-top:16px">Nuevo tipo</label>
     <select id="sk-kind">
       <option value="fact">fact</option><option value="event">event</option><option value="commitment">commitment</option>
     </select>
     <label style="margin-top:16px">Motivo</label><input type="text" id="sk-reason" placeholder="ej. describe una configuración ya aplicada, no una acción pendiente">
     <button class="run" id="sk-run" disabled style="margin-top:16px">Cambiar tipo</button>
     <div class="status" id="sk-status">Primero pulsa "Ver registro(s)" para confirmar qué vas a cambiar.</div>`);

  const idInput = sec.querySelector('#sk-id');
  const runBtn = sec.querySelector('#sk-run');
  const statusEl = sec.querySelector('#sk-status');
  let previewedFor = null;
  let previewedFacts = [];

  function invalidatePreview() {
    previewedFor = null;
    previewedFacts = [];
    runBtn.disabled = true;
    statusEl.textContent = 'El id cambió, vuelve a pulsar "Ver registro(s)" antes de cambiar el tipo.';
  }
  idInput.addEventListener('input', invalidatePreview);

  sec.querySelector('#sk-preview').addEventListener('click', async () => {
    const id = idInput.value.trim();
    if (!id) { out(sec, { ok: false, stdout: '', stderr: 'Falta el id.' }); return; }
    const r = await call('GET', '/api/records?id=' + encodeURIComponent(id));
    out(sec, r);
    if (r.ok && !/^Ningún id existe\.?$/.test((r.stdout || '').trim())) {
      previewedFor = id;
      previewedFacts = [...(r.stdout || '').matchAll(/#(\d+) \[[\d-]+\] \[([^\]]+)\] (.+)/g)]
        .map((m) => ({ id: m[1], status: m[2], claim: m[3] }));
      runBtn.disabled = false;
      statusEl.textContent = `Contenido verificado para el id "${id}", ya puedes cambiar el tipo.`;
    } else {
      invalidatePreview();
      statusEl.textContent = 'No se pudo previsualizar, revisa el id.';
    }
  });

  runBtn.addEventListener('click', async () => {
    const id = idInput.value.trim();
    const kind = sec.querySelector('#sk-kind').value;
    const reason = sec.querySelector('#sk-reason').value.trim();
    if (!reason) { out(sec, { ok: false, stdout: '', stderr: 'Falta el motivo.' }); return; }
    if (previewedFor !== id) { out(sec, { ok: false, stdout: '', stderr: 'Vuelve a pulsar "Ver registro(s)", el id no coincide con el último previsualizado.' }); return; }

    const summary = previewedFacts.map((f) => `#${f.id} [${f.status}]: ${f.claim.slice(0, 100)}${f.claim.length > 100 ? '…' : ''}`).join('\n');
    const confirmed = await confirmAction(`¿Confirmas cambiar ${previewedFacts.length} registro(s) a "${kind}"?\n\n${summary}\n\nMotivo: ${reason}`);
    if (!confirmed) { statusEl.textContent = 'Cambio cancelado por el usuario.'; return; }

    out(sec, await call('POST', '/api/set-record-kind', { id, kind, reason }));
    invalidatePreview();
  });
}

// --- Editar registro ---
// edit-record.mjs, 2026-09-08: "super edición" pedida por Oscar, cualquier
// campo de un registro (claim/date/kind/source/memory) en un solo llamado.
// Mismo patrón previsualizar-antes-de-confirmar que Cambiar tipo/Retractar,
// pero acá la previsualización además PRECARGA los campos con el valor
// actual -- sin eso, el usuario tendría que retipear todo el registro solo
// para cambiar un carácter. Solo se manda al backend lo que de verdad
// cambió (comparado contra lo precargado), para no recalcular el embedding
// ni tocar record_memories sin necesidad cuando ese campo no se tocó.
{
  const sec = section('edit-record', 'Editar registro', 'Edita directamente cualquier campo de un registro ya existente ("edit-record.mjs"): claim, fecha, tipo, fuente, recuerdo(s). A diferencia de Retractar (que invalida sin reemplazar) o Cambiar tipo/Recategorizar (un solo campo cada uno), esto corrige el registro tal cual, sin dejar rastro de la versión anterior salvo lo que digas en "Motivo". Úsalo para errores reales de captura (typo, fecha mal tomada, fuente equivocada), no para reinterpretar algo que en su momento se guardó bien.',
    `<label>Id</label><input type="text" id="er-id" placeholder="412">
     <button class="run secondary" id="er-preview" style="margin-top:8px">Ver registro</button>
     <div id="er-fields" style="display:none">
       <label style="margin-top:16px">Claim</label><textarea id="er-claim"></textarea>
       <div class="row">
         <div><label>Fecha</label><input type="date" id="er-date"></div>
         <div><label>Tipo</label>
           <select id="er-kind"><option value="fact">fact</option><option value="event">event</option><option value="commitment">commitment</option></select>
         </div>
       </div>
       <label style="margin-top:16px">Fuente</label><input type="text" id="er-source">
       <label style="margin-top:16px">Recuerdo(s) (separados por coma)</label>
       <input type="text" id="er-memory" list="er-memories-list">
       <datalist id="er-memories-list"></datalist>
       <div class="checkline" style="margin-top:8px">
         <input type="checkbox" id="er-create-memory">
         <label for="er-create-memory">Crear el/los recuerdo(s) si no existen (--create-memory)</label>
       </div>
       <label style="margin-top:16px">Motivo</label><input type="text" id="er-reason" placeholder="ej. la fecha capturada era la de la sesión, no la del evento">
       <button class="run" id="er-run" style="margin-top:16px">Guardar cambios</button>
     </div>
     <div class="status" id="er-status">Primero pulsa "Ver registro" para cargar sus valores actuales.</div>`);

  call('GET', '/api/memories').then((r) => {
    const list = sec.querySelector('#er-memories-list');
    (r.memories ?? []).forEach((m) => { const opt = document.createElement('option'); opt.value = m.name; list.appendChild(opt); });
  });

  const idInput = sec.querySelector('#er-id');
  const fieldsWrap = sec.querySelector('#er-fields');
  const statusEl = sec.querySelector('#er-status');
  const runBtn = sec.querySelector('#er-run');
  let previewedFor = null;
  let previewed = null; // { claim, date, kind, source, memory }

  function invalidatePreview() {
    previewedFor = null;
    previewed = null;
    fieldsWrap.style.display = 'none';
    statusEl.textContent = 'El id cambió, vuelve a pulsar "Ver registro" antes de guardar.';
  }
  idInput.addEventListener('input', invalidatePreview);

  sec.querySelector('#er-preview').addEventListener('click', async () => {
    const id = idInput.value.trim();
    if (!id) { statusEl.textContent = 'Falta el id.'; return; }
    const r = await call('GET', '/api/records?json=1&id=' + encodeURIComponent(id));
    if (!r.ok || !(r.records ?? [])[0]) {
      invalidatePreview();
      statusEl.textContent = r.ok ? `No existe ningún registro #${id}.` : ('Error: ' + r.error);
      return;
    }
    const rec = r.records[0];
    previewedFor = id;
    previewed = { claim: rec.claim, date: rec.date, kind: rec.kind, source: rec.source, memory: [...rec.memories].sort().join(',') };
    sec.querySelector('#er-claim').value = rec.claim;
    sec.querySelector('#er-date').value = rec.date;
    sec.querySelector('#er-kind').value = rec.kind;
    sec.querySelector('#er-source').value = rec.source;
    sec.querySelector('#er-memory').value = rec.memories.join(',');
    fieldsWrap.style.display = '';
    statusEl.textContent = rec.valid_until
      ? `#${id} ya está retractado${rec.superseded_by ? ` (reemplazado por #${rec.superseded_by})` : ''} -- se puede seguir editando para corregir el dato histórico.`
      : `Cargado #${id}, edita lo que necesites y confirma.`;
  });

  runBtn.addEventListener('click', async () => {
    const id = idInput.value.trim();
    if (previewedFor !== id) { statusEl.textContent = 'Vuelve a pulsar "Ver registro", el id no coincide con el último previsualizado.'; return; }
    const reason = sec.querySelector('#er-reason').value.trim();
    if (!reason) { statusEl.textContent = 'Falta el motivo.'; return; }

    const claim = sec.querySelector('#er-claim').value.trim();
    const date = sec.querySelector('#er-date').value;
    const kind = sec.querySelector('#er-kind').value;
    const source = sec.querySelector('#er-source').value.trim();
    const memory = sec.querySelector('#er-memory').value.split(',').map((s) => s.trim()).filter(Boolean).sort().join(',');

    const body = { id, reason };
    const changes = [];
    if (claim !== previewed.claim) { body.claim = claim; changes.push('claim'); }
    if (date !== previewed.date) { body.date = date; changes.push('fecha'); }
    if (kind !== previewed.kind) { body.kind = kind; changes.push('tipo'); }
    if (source !== previewed.source) { body.source = source; changes.push('fuente'); }
    if (memory !== previewed.memory) { body.memory = memory; changes.push('recuerdo(s)'); }
    if (sec.querySelector('#er-create-memory').checked) body.createMemory = true;

    if (changes.length === 0) { statusEl.textContent = 'Nada cambió respecto a lo cargado, no hay nada que guardar.'; return; }

    const confirmed = await confirmAction(`¿Confirmas editar #${id}? Campos que cambian: ${changes.join(', ')}.\n\nMotivo: ${reason}`);
    if (!confirmed) { statusEl.textContent = 'Edición cancelada por el usuario.'; return; }

    out(sec, await call('POST', '/api/edit-record', body));
    invalidatePreview();
  });
}

  const dateInput = sec.querySelector('#rm-date');
  const confirmDateWrap = sec.querySelector('#rm-confirm-date-wrap');
  const confirmDateCheck = sec.querySelector('#rm-confirm-date');
  dateInput.value = todayBogota(); // default: hoy, mismo motivo que el bloqueo de #528, reduce el caso de guardar sin darse cuenta con la fecha equivocada

  function syncConfirmDateVisibility() {
    const mismatched = dateInput.value && dateInput.value !== todayBogota();
    confirmDateWrap.style.display = mismatched ? 'flex' : 'none';

  }

      kind: sec.querySelector('#rm-kind').value,

      supersedes: sec.querySelector('#rm-supersedes').value.trim() || undefined,
      distinct: sec.querySelector('#rm-distinct').checked || undefined,
      confirmDate: confirmDateCheck.checked || undefined,
    };
    if (!body.claim || !body.date || !body.source) { out(sec, { ok: false, stdout: '', stderr: 'Faltan claim/fecha/fuente.' }); return; }
    if (body.date !== todayBogota() && !body.confirmDate) {
      out(sec, { ok: false, stdout: '', stderr: `La fecha (${body.date}) es distinta de hoy (${todayBogota()}), marca "Confirmo que la fecha distinta de hoy es intencional" antes de guardar.` });
      return;
    }
    if (body.createNode && !body.memory) {
      out(sec, { ok: false, stdout: '', stderr: 'Marcaste "Crear recuerdo nuevo" pero el campo "Recuerdo(s)" está vacío, escribe ahí el nombre del recuerdo nuevo antes de guardar.' });
      return;
    }
    if (body.aliases && !body.createNode) {
      out(sec, { ok: false, stdout: '', stderr: 'Escribiste alias pero no marcaste "Crear recuerdo nuevo", los alias solo aplican al crear un recuerdo.' });
      return;

    // que no ve el recuadro de salida más abajo) no tiene ninguna señal de
    // que el guardado ya corrió, y puede volver a hacer clic: insertando
    // el mismo registro dos veces (visto en vivo: #513 duplicado por #514,
    // mismo contenido). El botón deshabilitado + "Guardando…" cubre el
    // primer caso; vaciar el claim solo en éxito real es la señal fuerte:
    // si el texto sigue ahí, no se guardó (o falló/bloqueó), así de simple.
    const btn = sec.querySelector('#rm-run');
    btn.disabled = true;

  });

// --- Retractar ---
{
  const sec = section('forget', 'Retractar', 'Invalida un registro vigente sin reemplazarlo ("forget.mjs"). Nunca borra la fila, el motivo queda anotado y sigue consultable con --all en Timeline. Para borrar de verdad basura sin ningún valor histórico (pruebas, duplicados de debugging), usa "Borrar registro" (Opciones avanzadas): solo borra lo ya retractado, nunca un registro vigente en un solo paso.',
    `<label>Id(s) (separados por coma)</label><input type="text" id="fg-id" placeholder="159,160">
     <button class="run secondary" id="fg-preview" style="margin-top:8px">Ver registro(s)</button>

     <button class="run" id="fg-run" disabled>Retractar</button>
     <div class="status" id="fg-status">Primero pulsa "Ver registro(s)" para confirmar qué vas a retractar.</div>`);

  const idInput = sec.querySelector('#fg-id');
  const runBtn = sec.querySelector('#fg-run');
  const statusEl = sec.querySelector('#fg-status');
  let previewedFor = null; // último valor de id para el que sí se vio el contenido
  let previewedFacts = []; // [{id, claim}] del último preview, para el confirm() final

  function invalidatePreview() {
    previewedFor = null;
    previewedFacts = [];
    runBtn.disabled = true;
    statusEl.textContent = 'El id cambió, vuelve a pulsar "Ver registro(s)" antes de retractar.';
  }
  idInput.addEventListener('input', invalidatePreview);

  sec.querySelector('#fg-preview').addEventListener('click', async () => {
    const id = idInput.value.trim();
    if (!id) { out(sec, { ok: false, stdout: '', stderr: 'Falta el id.' }); return; }
    const r = await call('GET', '/api/records?id=' + encodeURIComponent(id));
    out(sec, r);
    if (r.ok && !/^Ningún id existe\.?$/.test((r.stdout || '').trim())) {
      previewedFor = id;
      previewedFacts = [...(r.stdout || '').matchAll(/#(\d+) \[[\d-]+\] \[([^\]]+)\] (.+)/g)]
        .map((m) => ({ id: m[1], status: m[2], claim: m[3] }));
      runBtn.disabled = false;
      statusEl.textContent = `Contenido verificado para el id "${id}", ya puedes retractar.`;
    } else {
      invalidatePreview();
      statusEl.textContent = 'No se pudo previsualizar, revisa el id.';
    }
  });

  runBtn.addEventListener('click', async () => {
    const id = idInput.value.trim();
    const reason = sec.querySelector('#fg-reason').value.trim();
    if (!id || !reason) { out(sec, { ok: false, stdout: '', stderr: 'Faltan id/motivo.' }); return; }
    if (previewedFor !== id) { out(sec, { ok: false, stdout: '', stderr: 'Vuelve a pulsar "Ver registro(s)", el id no coincide con el último previsualizado.' }); return; }

    const summary = previewedFacts.map((f) => `#${f.id} [${f.status}]: ${f.claim.slice(0, 100)}${f.claim.length > 100 ? '…' : ''}`).join('\n');
    const confirmed = await confirmAction(
      `¿Confirmas retractar ${previewedFacts.length} registro(s)?\n\n${summary}\n\nMotivo: ${reason}`,
    );
    if (!confirmed) { statusEl.textContent = 'Retracto cancelado por el usuario.'; return; }

    out(sec, await call('POST', '/api/forget', { id, reason }));
    invalidatePreview();
  });
}

// --- Extraer de sesión ---
// No ejecuta nada del lado del servidor: "extraer de sesión" ya es posible

// .mjs a mano), y --review (revisión interactiva antes de insertar) solo
// tiene sentido en una terminal real con TTY. El frontend solo arma el
// comando exacto con los flags elegidos, para copiar y correr donde el
// usuario prefiera.
{
  const sec = section('extract-records', 'Extraer de sesión', 'No hay un único camino: depende de dónde estés. Elige tu caso.',
    `<ul class="scenarios">
       <li><strong>Chat, Cowork, Code o CLI, en cualquier repo:</strong>
         usa la skill <code>/extract-code-records</code> + MyMCP. O pídele al LLM:
         <em>"extrae los registros de esta sesión y usa MyMCP para subirlos a nuestro segundo cerebro."</em></li>
       <li><strong>Dentro de la carpeta local del segundo cerebro (ej. C:\\segundo-cerebro):</strong>
         pídele al LLM <em>"extrae los registros de la sesión de hoy y súbelos a nuestro segundo cerebro"</em>.
         Si necesitas algo más preciso (fecha/hora exactas, proveedor, revisión interactiva), arma el
         comando de abajo y córrelo tú mismo en una terminal.</li>
     </ul>
     <p class="hint" style="margin-top:22px">Arma el comando de "extract-records.mjs" para tu propia terminal, donde sí puedes usar --review. Este botón no ejecuta nada: solo copia el comando.</p>
     <div class="row">
       <div><label>Fecha</label><input type="date" id="ef-date"></div>
       <div><label>Desde</label><input type="time" id="ef-from"></div>
       <div><label>Hasta</label><input type="time" id="ef-to"></div>
     </div>
     <div class="row">
       <div><label>Proveedor</label>
         <select id="ef-provider"><option value="gemini">gemini</option><option value="ollama">ollama</option></select>
       </div>
       <div><label>Modelo (opcional, override sin fallback)</label>
         <select id="ef-model"><option value="">(auto, probar en orden)</option></select>
       </div>
     </div>
     <label>Sesión (opcional, id del .jsonl, vacío = la más reciente)</label>
     <input type="text" id="ef-session">
     <div class="checkline"><input type="checkbox" id="ef-review"><label for="ef-review">Revisión interactiva (--review, requiere terminal real)</label></div>
     <label style="margin-top:16px">Comando</label>
     <pre class="out ok" id="ef-cmd" style="margin-top:4px; user-select: all;"></pre>
     <button class="run secondary" id="ef-copy">Copiar comando</button>`);

  const providerSel = sec.querySelector('#ef-provider');
  const modelSel = sec.querySelector('#ef-model');
  const cmdEl = sec.querySelector('#ef-cmd');

  async function loadModelOptions() {
    modelSel.innerHTML = '<option value="">(auto, probar en orden)</option>';
    const r = await call('GET', '/api/model-config?provider=' + providerSel.value);
    for (const m of r.fallbackOrder ?? []) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      modelSel.appendChild(opt);
    }
  }
  providerSel.addEventListener('change', () => { loadModelOptions().then(renderCommand); });
  loadModelOptions();

  function shellQuote(s) {
    return /[^\w.\-:/]/.test(s) ? `"${s.replace(/"/g, '\\"')}"` : s;
  }

  function renderCommand() {
    const date = sec.querySelector('#ef-date').value;
    const from = sec.querySelector('#ef-from').value;
    const to = sec.querySelector('#ef-to').value;
    const provider = providerSel.value;
    const model = modelSel.value;
    const session = sec.querySelector('#ef-session').value.trim();
    const review = sec.querySelector('#ef-review').checked;

    const parts = ['node', 'scripts/db/extract-records.mjs'];
    parts.push('--date', date || 'YYYY-MM-DD');
    parts.push('--from', from || 'HH:MM');
    parts.push('--to', to || 'HH:MM');
    if (provider !== 'gemini') parts.push('--provider', provider);
    if (model) parts.push('--model', model);
    if (session) parts.push('--session', shellQuote(session));
    if (review) parts.push('--review');

    cmdEl.textContent = parts.join(' ');
  }

  for (const id of ['ef-date', 'ef-from', 'ef-to', 'ef-model', 'ef-session', 'ef-review']) {
    sec.querySelector('#' + id).addEventListener('input', renderCommand);
    sec.querySelector('#' + id).addEventListener('change', renderCommand);
  }
  renderCommand();

  sec.querySelector('#ef-copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(cmdEl.textContent);
      sec.querySelector('#ef-copy').textContent = 'Copiado';
      setTimeout(() => { sec.querySelector('#ef-copy').textContent = 'Copiar comando'; }, 1500);
    } catch {
      // clipboard puede fallar sin HTTPS/permiso: el texto ya está seleccionable (user-select: all)
    }
  });
}

     <div class="row">
       <div><label>Proveedor</label>
         <select id="epf-provider"><option value="gemini">gemini</option><option value="ollama">ollama</option></select>
       </div>
       <div><label>Modelo (opcional, override sin fallback)</label>
         <select id="epf-model"><option value="">(auto, probar en orden)</option></select>
       </div>
     </div>
     <button class="run" id="epf-extract">Extraer candidatos</button>
     <div class="status" id="epf-info"></div>
     <datalist id="epf-memories-list"></datalist>
     <div id="epf-cards"></div>
     <p class="hint" id="epf-merge-hint" style="display:none">Clic derecho sobre cualquier tarjeta marcada "Fusionar con otra(s)" para combinarla con las demás marcadas.</p>
     <div class="checkline" id="epf-confirm-date-wrap" style="display:none">
       <input type="checkbox" id="epf-confirm-date">
       <label for="epf-confirm-date">Confirmo que las fechas distintas de hoy son intencionales (--confirm-date, ej. un timeline histórico)</label>
     </div>
     <button class="run" id="epf-insert" style="display:none">Insertar aprobados</button>`);

  const providerSel = sec.querySelector('#epf-provider');
  const modelSel = sec.querySelector('#epf-model');
  const extractBtn = sec.querySelector('#epf-extract');
  const infoEl = sec.querySelector('#epf-info');
  const cardsEl = sec.querySelector('#epf-cards');
  const insertBtn = sec.querySelector('#epf-insert');
  const nodesList = sec.querySelector('#epf-memories-list');
  const confirmDateWrap = sec.querySelector('#epf-confirm-date-wrap');
  const confirmDateCheck = sec.querySelector('#epf-confirm-date');
  const mergeHint = sec.querySelector('#epf-merge-hint');

  // Igual que en "Guardar registro"/"Guardar lote": remember-batch.mjs
  // rechaza (exit 1) cualquier fecha distinta de hoy sin --confirm-date, y
  // esta sección no tenía forma de marcarlo -- "Insertar aprobados" quedaba
  // sin poder avanzar nunca que un candidato trajera una fecha real
  // extraída del texto (ej. un timeline histórico), sin ningún mensaje que
  // explicara por qué ni cómo reintentar. La casilla solo aparece cuando de
  // verdad hace falta.
  function syncConfirmDateVisibility() {
    const mismatched = [...cardsEl.querySelectorAll('.fc-date')].some((el) => el.value && el.value !== todayBogota());
    confirmDateWrap.style.display = mismatched ? 'flex' : 'none';
    if (!mismatched) confirmDateCheck.checked = false;
  }
  cardsEl.addEventListener('change', (e) => { if (e.target.classList.contains('fc-date')) syncConfirmDateVisibility(); });

  call('GET', '/api/pages').then((r) => {
    const list = sec.querySelector('#epf-pages-list');
    for (const p of r.pages ?? []) {
      const opt = document.createElement('option');
      opt.value = p.slug ?? p;
      list.appendChild(opt);
    }
  });
  call('GET', '/api/memories').then((r) => {
    for (const n of r.memories ?? []) {
      const opt = document.createElement('option');
      opt.value = n.name;
      nodesList.appendChild(opt);
    }
  });

  async function loadModelOptions() {
    modelSel.innerHTML = '<option value="">(auto, probar en orden)</option>';
    const r = await call('GET', '/api/model-config?provider=' + providerSel.value);
    for (const m of r.fallbackOrder ?? []) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      modelSel.appendChild(opt);
    }
  }
  providerSel.addEventListener('change', loadModelOptions);
  loadModelOptions();

  let lastSource = '';

  function renderCard(fact, index, fallbackDate) {
    const card = document.createElement('div');
    card.className = 'fact-card';
    card.dataset.index = String(index);
    const suggestionsHtml = (fact.similarNodes ?? []).length
      ? (fact.similarNodes ?? []).map((n) => `<span data-node="${n.memory_name.replace(/"/g, '&quot;')}">${n.memory_name} (${n.similarity.toFixed(2)})</span>`).join(', ')
      : '(sin sugerencias)';
    card.innerHTML = `
      <div class="fc-top">
        <input type="checkbox" class="fc-include" checked>
        <label>Incluir #${index + 1} (${fact.kind})</label>
        <span style="flex:1"></span>
        <input type="checkbox" class="fc-merge">
        <label>Fusionar con otra(s)</label>
      </div>
      <label>registro</label>
      <textarea class="fc-claim">${fact.claim.replace(/</g, '&lt;')}</textarea>
      <div class="row">
        <div><label>Fecha</label><input type="date" class="fc-date" value="${fact.date ?? fallbackDate ?? ''}"></div>
        <div><label>Tipo</label>
          <select class="fc-kind">
            <option value="fact">fact</option><option value="event">event</option>
            <option value="commitment">commitment</option>
          </select>
        </div>
      </div>
      <label>Recuerdo</label>
      <input type="text" class="fc-node" value="${fact.node}" list="epf-memories-list">
      <div class="fc-suggestions">recuerdos parecidos: ${suggestionsHtml}</div>
      <div class="checkline"><input type="checkbox" class="fc-distinct"><label>Confirmar distinto pese a registros parecidos (--distinct, solo si "Insertar aprobados" lo bloquea por duplicado)</label></div>
      <div class="fc-fragment">"${(fact.sourceFragment ?? '').replace(/</g, '&lt;')}"</div>`;
    card.querySelector('.fc-kind').value = fact.kind;
    card.querySelector('.fc-include').addEventListener('change', (e) => card.classList.toggle('excluded', !e.target.checked));
    card.querySelector('.fc-merge').addEventListener('change', () => syncMergeHintVisibility());
    for (const span of card.querySelectorAll('.fc-suggestions span')) {
      span.addEventListener('click', () => { card.querySelector('.fc-node').value = span.dataset.node; });
    }
    return card;
  }

  // Fusión manual de tarjetas (2026-09-09, registro #690/#700 en UAObrain):
  // pedido de Oscar tras ver que nemotron-3-ultra tiende a sobre-fragmentar
  // un mismo hecho en varios candidatos. En vez de intentar que el
  // modelo/prompt lo resuelva (no generaliza a otros modelos ni a
  // extracciones futuras), la fusión es puramente del lado del dashboard:
  // concatena los "claim" de las tarjetas marcadas, en el orden en que
  // aparecen, en la primera de ellas, y borra el resto. El usuario edita el
  // texto fusionado a mano después, como con cualquier tarjeta -- la
  // decisión de cómo integrar queda de su lado. Se activa vía menú
  // contextual (clic derecho sobre cualquier tarjeta marcada, 2+ marcadas)
  // en vez de un botón fijo debajo de la lista: con extracciones de 20+
  // candidatos, bajar hasta el final cada vez no era cómodo. Mismo patrón
  // .gph-ctx-menu ya usado en el grafo ("Ver timeline"/"Ver estado del
  // recuerdo" más arriba en este archivo).
  function syncMergeHintVisibility() {
    const marked = cardsEl.querySelectorAll('.fc-merge:checked');
    mergeHint.style.display = marked.length >= 2 ? '' : 'none';
  }

  function performMerge() {
    const cards = [...cardsEl.querySelectorAll('.fact-card')].filter((c) => c.querySelector('.fc-merge').checked);
    if (cards.length < 2) return;
    const [target, ...rest] = cards;
    const claims = cards.map((c) => c.querySelector('.fc-claim').value.trim());
    target.querySelector('.fc-claim').value = claims.join(' ');
    target.querySelector('.fc-merge').checked = false;
    for (const c of rest) c.remove();
    syncMergeHintVisibility();
    syncConfirmDateVisibility();
  }

  const mergeCtxMenu = document.createElement('div');
  mergeCtxMenu.className = 'gph-ctx-menu';
  mergeCtxMenu.innerHTML = `<button type="button">Fusionar seleccionadas</button>`;
  document.body.appendChild(mergeCtxMenu);
  function hideMergeCtxMenu() { mergeCtxMenu.style.display = 'none'; }
  document.addEventListener('click', hideMergeCtxMenu);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideMergeCtxMenu(); });
  mergeCtxMenu.querySelector('button').addEventListener('click', (e) => {
    e.stopPropagation();
    hideMergeCtxMenu();
    performMerge();
  });
  cardsEl.addEventListener('contextmenu', (e) => {
    const card = e.target.closest('.fact-card');
    if (!card) return;
    const marked = cardsEl.querySelectorAll('.fc-merge:checked');
    if (marked.length < 2) return; // deja el menú nativo del navegador si no hay nada que fusionar
    e.preventDefault();
    const btn = mergeCtxMenu.querySelector('button');
    btn.textContent = `Fusionar seleccionadas (${marked.length})`;
    mergeCtxMenu.style.display = 'block';
    const menuW = 220, menuH = 40;
    mergeCtxMenu.style.left = Math.min(e.clientX, window.innerWidth - menuW - 8) + 'px';
    mergeCtxMenu.style.top = Math.min(e.clientY, window.innerHeight - menuH - 8) + 'px';
  });

  extractBtn.addEventListener('click', async () => {
    const page = sec.querySelector('#epf-page').value.trim();
    if (!page) { infoEl.textContent = 'Falta la página.'; return; }
    cardsEl.innerHTML = '';
    insertBtn.style.display = 'none';
    mergeHint.style.display = 'none';
    extractBtn.disabled = true;
    infoEl.textContent = 'Extrayendo (puede tardar, corre un LLM sobre el contenido)…';
    try {
      const params = new URLSearchParams({ page });
      if (providerSel.value !== 'gemini') params.set('provider', providerSel.value);
      if (modelSel.value) params.set('model', modelSel.value);
      const r = await call('GET', '/api/extract-page-records?' + params.toString());
      if (!r.ok) { infoEl.textContent = 'Error: ' + r.error; return; }
      lastSource = r.source;
      const nodeInfo = r.liveNode && r.liveNode !== r.defaultNode ? `fusionado, vigente: "${r.liveNode}"` : r.liveNode ? 'ya existe' : 'nuevo';
      infoEl.textContent = `Página: ${r.page.slug} (${r.page.type}) · recuerdo por defecto "${r.defaultNode}" (${nodeInfo}) · ${r.existingFactsCount} registro(s) ya vigente(s) · ${r.records.length} candidato(s).`;
      if (r.records.length === 0) return;
      const fallbackDate = r.page.updatedAt ? r.page.updatedAt.slice(0, 10) : '';
      r.records.forEach((f, i) => cardsEl.appendChild(renderCard(f, i, fallbackDate)));
      insertBtn.style.display = '';
      syncConfirmDateVisibility();
    } finally {
      extractBtn.disabled = false;
    }
  });

  insertBtn.addEventListener('click', async () => {
    const cards = [...cardsEl.querySelectorAll('.fact-card')].filter((c) => c.querySelector('.fc-include').checked);
    if (cards.length === 0) { out(sec, { ok: false, stdout: '', stderr: 'No hay ningún candidato incluido.' }); return; }
    const records = cards.map((c) => ({
      claim: c.querySelector('.fc-claim').value.trim(),
      date: c.querySelector('.fc-date').value || undefined,
      kind: c.querySelector('.fc-kind').value,
      // memory/createMemory, no node/createNode (2026-09-09): remember-batch.mjs
      // en este repo ya fue renombrado limpio, sin el alias de compatibilidad
      // que sí tiene UAObrain -- con los nombres viejos, el recuerdo escrito en
      // la tarjeta se descartaba en silencio en cada inserción (requestedNodes
      // quedaba vacío, caía siempre a desambiguación automática).
      memory: c.querySelector('.fc-node').value.trim(),
      source: lastSource,
      createMemory: true,
      distinct: c.querySelector('.fc-distinct').checked || undefined,
    }));
    const confirmDate = confirmDateCheck.checked || undefined;
    if (!confirmDate && records.some((r) => r.date && r.date !== todayBogota())) {
      out(sec, { ok: false, stdout: '', stderr: `Uno o más candidatos incluidos tienen una fecha distinta de hoy (${todayBogota()}), marca "Confirmo que las fechas distintas de hoy son intencionales" antes de insertar.` });
      return;
    }
    await runRememberBatchStream(sec, { records, confirmDate }, insertBtn);
  });
}

// --- Configuración ---
// Tema/color/densidad/movimiento, guardados en localStorage (por navegador,
// no viaja entre máquinas ni con el repo). Alto contraste bloquea el
// override de acento/colores del grafo a propósito -- ver applySettings().
{
  const sec = section('settings', 'Configuración', 'Tema, colores y accesibilidad del dashboard. Se guarda en este navegador (localStorage) -- no sincroniza entre máquinas ni viaja con git.',
    `<label>Tema</label>
     <select id="cfg-theme">
       <option value="system">Seguir el sistema</option>
       <option value="dark">Oscuro</option>
       <option value="light">Claro</option>
       <option value="hc-dark">Alto contraste (oscuro)</option>
       <option value="hc-light">Alto contraste (claro)</option>
     </select>

     <label style="margin-top:18px">Densidad</label>
     <select id="cfg-density">
       <option value="compact">Compacta</option>
       <option value="comfortable">Cómoda</option>
       <option value="large">Grande</option>
     </select>

     <label style="margin-top:18px">Reducir movimiento (animación del grafo al cargar)</label>
     <select id="cfg-reduce-motion">
       <option value="system">Seguir el sistema</option>
       <option value="on">Activado</option>
       <option value="off">Desactivado</option>
     </select>

     <label style="margin-top:26px">Síntesis por defecto en "Buscar"</label>
     <div class="row">
       <div><label style="margin-top:0">Proveedor</label>
         <select id="cfg-search-provider">
           <option value="ollama">Ollama Cloud</option>
           <option value="gemini">Gemini</option>
         </select>
       </div>
       <div><label style="margin-top:0">Modelo (opcional, override sin fallback)</label>
         <select id="cfg-search-model"><option value="">(auto -- probar en orden)</option></select>
       </div>
     </div>

     <p class="hint" id="cfg-hc-notice" style="margin-top:18px; display:none">Con un tema de alto contraste activo, el color de acento y los colores del grafo quedan fijos (protege el contraste garantizado) -- los controles de abajo no tienen efecto hasta que cambies a un tema normal.</p>

     <div class="row" style="margin-top:18px">
       <div><label>Color de acento</label><input type="color" id="cfg-accent"></div>
       <div style="flex:0; align-self:flex-end"><button class="run secondary" id="cfg-accent-reset" style="margin-top:0">Restablecer</button></div>
     </div>

     <label style="margin-top:18px">Colores del grafo</label>
     <div class="row">
       <div><label style="margin-top:0">Recuerdo normal</label><input type="color" id="cfg-graph-normal"></div>
       <div><label style="margin-top:0">Recuerdo meta</label><input type="color" id="cfg-graph-meta"></div>
       <div><label style="margin-top:0">Resaltado</label><input type="color" id="cfg-graph-highlight"></div>
     </div>
     <button class="run secondary" id="cfg-graph-reset">Restablecer colores del grafo</button>

     <div style="margin-top:26px"><button class="run" id="cfg-reset-all">Restablecer todo</button></div>`);

  const themeSel = sec.querySelector('#cfg-theme');
  const densitySel = sec.querySelector('#cfg-density');
  const motionSel = sec.querySelector('#cfg-reduce-motion');
  const searchProviderSel = sec.querySelector('#cfg-search-provider');
  const searchModelSel = sec.querySelector('#cfg-search-model');
  const hcNotice = sec.querySelector('#cfg-hc-notice');
  const accentInput = sec.querySelector('#cfg-accent');
  const graphNormalInput = sec.querySelector('#cfg-graph-normal');
  const graphMetaInput = sec.querySelector('#cfg-graph-meta');
  const graphHighlightInput = sec.querySelector('#cfg-graph-highlight');

  function computedVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#000000';
  }

  async function loadSearchModelOptions() {
    searchModelSel.innerHTML = '<option value="">(auto -- probar en orden)</option>';
    const r = await call('GET', '/api/model-config?provider=' + searchProviderSel.value);
    for (const m of r.fallbackOrder ?? []) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      searchModelSel.appendChild(opt);
    }
    searchModelSel.value = settings.searchSynthModel || '';
  }

  function syncControlsFromSettings() {
    themeSel.value = settings.theme;
    densitySel.value = settings.density;
    motionSel.value = settings.reduceMotion;
    searchProviderSel.value = settings.searchSynthProvider;
    const hc = isHighContrastTheme();
    hcNotice.style.display = hc ? 'block' : 'none';
    accentInput.disabled = graphNormalInput.disabled = graphMetaInput.disabled = graphHighlightInput.disabled = hc;
    sec.querySelector('#cfg-accent-reset').disabled = sec.querySelector('#cfg-graph-reset').disabled = hc;
    accentInput.value = settings.accent || computedVar('--accent');
    graphNormalInput.value = settings.graphNormal || computedVar('--accent');
    graphMetaInput.value = settings.graphMeta || computedVar('--warn');
    graphHighlightInput.value = settings.graphHighlight || computedVar('--err');
  }

  function update(patch) {
    Object.assign(settings, patch);
    saveSettings();
    applySettings();
    syncControlsFromSettings();
  }

  themeSel.addEventListener('change', () => update({ theme: themeSel.value }));
  densitySel.addEventListener('change', () => update({ density: densitySel.value }));
  motionSel.addEventListener('change', () => update({ reduceMotion: motionSel.value }));
  searchProviderSel.addEventListener('change', async () => {
    update({ searchSynthProvider: searchProviderSel.value, searchSynthModel: '' });
    await loadSearchModelOptions();
  });
  searchModelSel.addEventListener('change', () => update({ searchSynthModel: searchModelSel.value }));
  accentInput.addEventListener('input', () => update({ accent: accentInput.value }));
  graphNormalInput.addEventListener('input', () => update({ graphNormal: graphNormalInput.value }));
  graphMetaInput.addEventListener('input', () => update({ graphMeta: graphMetaInput.value }));
  graphHighlightInput.addEventListener('input', () => update({ graphHighlight: graphHighlightInput.value }));
  sec.querySelector('#cfg-accent-reset').addEventListener('click', () => update({ accent: '' }));
  sec.querySelector('#cfg-graph-reset').addEventListener('click', () => update({ graphNormal: '', graphMeta: '', graphHighlight: '' }));
  sec.querySelector('#cfg-reset-all').addEventListener('click', async () => {
    update({ ...DEFAULT_SETTINGS });
    await loadSearchModelOptions();
  });

  syncControlsFromSettings();
  loadSearchModelOptions();
}

// --- Opciones avanzadas ---
// Un checkbox por función, no un interruptor único "todo o nada" (primer
// diseño, corregido tras feedback del usuario 2026-09-05): alguien puede
// querer solo "Borrar registro" sin destapar Fusionar/Alias/Relaciones a
// la vez. Cada checkbox controla si su sección aparece en el nav
// (isFeatureEnabled()/setFeatureEnabled() arriba); nunca restringe acceso a
// las rutas /api/*, que responden igual estén o no visibles.
{
  const advancedSections = SECTIONS.filter((s) => s.advanced);
  const rows = advancedSections
    .map((s) => `<div class="checkline"><input type="checkbox" id="adv-${s.id}" data-target="${s.id}"><label for="adv-${s.id}">${s.label} <span class="hint" style="display:inline">(${s.group})</span></label></div>`)
    .join('');
  const sec = section('advanced-options', 'Opciones avanzadas', 'Cada función de mantenimiento/estructura se activa por separado -- ninguna es necesaria para el uso diario del dashboard. Esto solo cambia qué aparece en el menú de la izquierda, las rutas del servidor siguen respondiendo igual esté o no visible aquí.',
    rows);

  for (const s of advancedSections) {
    const cb = sec.querySelector(`#adv-${s.id}`);
    cb.checked = isFeatureEnabled(s.id);
    cb.addEventListener('change', () => {
      setFeatureEnabled(s.id, cb.checked);
      renderNav();
      show('advanced-options');
    });
  }
}

renderNav();
</script>
</body>
</html>
